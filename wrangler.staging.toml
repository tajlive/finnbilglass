# Staging-konfigurasjon — OE/VIN Pinpoint (Fase 1–3).
# Deployes KUN til workers.dev (ingen custom domains / ingen DNS-endringer).
# Bruk: wrangler deploy --config wrangler.staging.toml
name = "finnbilglass-frontrute-staging"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Tvinger prod-konto (80d5b1d5) — staging kjører på samme konto som prod
# (separat worker/bucket/D1). Hindrer at wrangler velger feil konto.
account_id = "80d5b1d56a3e907150ba7348b6182894"

# ── Workers AI (bilde-avlesning: 43R/eurocode/OEM/features) ──
[ai]
binding = "AI"

# ── D1 staging (resolver-data + prisliste-kopi) ─────────────────
[[d1_databases]]
binding = "FINNBILGLASS_DB"
database_name = "finnbilglass-staging-catalog"
database_id = "79d63481-d54b-4522-9e74-80415e781b7a"

# Henvendelser, auth og rate-limit ligger i egen staging-D1 (getInquiryDb).
# Uten denne bindingen kaster staging STAGING_MISSING_D1_BINDING → 500 på
# /api/inquiry, og hele tilbudsflyten kan ikke testes i staging.
[[d1_databases]]
binding = "FINNBILGLASS_STAGING_AUTH"
database_name = "finnbilglass-staging-auth"
database_id = "0b024ab6-4e9c-4fda-ab19-439e11e631fb"

[[r2_buckets]]
binding = "OPPLAERING_BUCKET"
bucket_name = "finnbilglass-opplaering-staging"

[vars]
ENVIRONMENT = "staging"
# Evidence-flyt feature-flags — staging verifiserer opplasting FØR prod.
EVIDENCE_UPLOAD_ENABLED = "true"
EVIDENCE_REVIEW_ENABLED = "false"
EVIDENCE_STATUS_CHANGE_ENABLED = "false"
# ALL_GLASS-kandidater (dør/side/ventil/bak/tak): PÅ i staging for E2E.
# Produksjon har ingen slik linje → quote-pilot (MANUAL_REVIEW).
ALL_GLASS_KANDIDATER_ENABLED = "true"
# Tilbudsmottak må være åpent i staging for å kunne teste hele kundereisen
# (samme flagg som prod bruker; prod styres av sin egen [vars]).
inquiries_enabled = "true"

# ── Observability: Workers Logs-lagring AV, invocation_logs PÅ (konsistens med prod) ──
[observability.logs]
enabled = false
invocation_logs = true

# ── Statisk frontend (samme public/) ────────────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/support/evidence", "/ops"]
