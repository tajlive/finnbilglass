name: Staging OPS - manual release gate

# One release lane. GitHub may deploy ONLY the existing staging Worker.
# No D1 Edit credential, no D1 SQL writes, no customer mail and no payments.
# Production deployments are intentionally not available here.
on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-ops.yml]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-char, reviewed HEAD SHA of draft PR #57"
        required: true
        type: string
      authorization:
        description: "Confirm existing staging Worker only; NO database operations"
        required: true
        default: STAGING-WORKER-ONLY
        type: choice
        options: [STAGING-WORKER-ONLY]
      deploy:
        description: "Explicitly deploy ONLY the existing staging Worker after QA"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: finnbilglass-staging-ops
  cancel-in-progress: false

jobs:
  verify-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Pin exact reviewed PR #57 SHA (fail closed)
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.candidate_sha }}
          AUTHORIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization || 'STAGING-WORKER-ONLY' }}
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "STAGING-WORKER-ONLY"
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/57")
          ACTUAL=$(echo "$PR" | jq -r .head.sha)
          BASE=$(echo "$PR" | jq -r .base.ref)
          HEAD=$(echo "$PR" | jq -r .head.ref)
          OWNER=$(echo "$PR" | jq -r .head.repo.full_name)
          DRAFT=$(echo "$PR" | jq -r .draft)
          STATE=$(echo "$PR" | jq -r .state)
          if [ "${{ github.event_name }}" = "push" ]; then EXPECTED="$ACTUAL"; fi
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED" = "$ACTUAL"
          test "$BASE" = main
          test "$HEAD" = staging/first-sale-20261110
          test "$OWNER" = "$GITHUB_REPOSITORY"
          test "$DRAFT" = true
          test "$STATE" = open
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
      - name: Verify checkout is pinned
        env:
          EXPECTED: ${{ steps.pin.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Full QA, including TypeScript and OPS regression tests
        run: npm run qa
      - name: Rehearse staging migrations OFFLINE (never execute against D1)
        run: python3 scripts/maintenance/staging-migration-rehearsal.py
      - name: Exact-SHA staging config guard and Wrangler dry run
        env:
          EXPECTED: ${{ steps.pin.outputs.sha }}
        run: node scripts/maintenance/ops-staging-preflight.mjs --expected-sha "$EXPECTED" --dry-run
      - name: Report candidate verified but NOT deployed
        run: |
          echo "### Candidate preflight PASSED; no Cloudflare write" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed commit: ${{ steps.pin.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "0046 schema previously verified separately; recheck runtime before release." >> "$GITHUB_STEP_SUMMARY"

  worker-only-staging:
    # Never run on push, PR or scheduler. Requires GitHub staging environment approval.
    needs: verify-candidate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "80d5b1d56a3e907150ba7348b6182894"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Exact-SHA and staging binding guard, no credentials
        env:
          EXPECTED: ${{ needs.verify-candidate.outputs.sha }}
        run: node scripts/maintenance/ops-staging-preflight.mjs --expected-sha "$EXPECTED" --dry-run
      - name: Verify narrow staging Worker permission and secret NAMES
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::One-time setup: Workers Editor token scoped ONLY to finnbilglass-frontrute-staging; do not use D1 Edit or production token"
            exit 1
          fi
          npx wrangler secret list --config wrangler.staging.toml --format json > /tmp/fbg-stage-secret-names.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const values=JSON.parse(fs.readFileSync('/tmp/fbg-stage-secret-names.json','utf8'));
          const names=new Set((Array.isArray(values)?values:[]).map(x=>x.name));
          for(const required of ['OPS_ACCESS_TEAM_DOMAIN','OPS_ACCESS_AUD','RESEND_API_KEY']){
            if(!names.has(required)) throw Error('MISSING_STAGING_SECRET_'+required);
          }
          console.log('Required staging Worker secret names exist; values not printed');
          NODE
      - name: Record currently deployed staging version for rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config wrangler.staging.toml --name finnbilglass-frontrute-staging --json > /tmp/fbg-stage-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/fbg-stage-before.json','utf8'));
          const list=Array.isArray(data)?data:(data.deployments||data.result?.deployments||[]);
          if(!list.length)throw Error('NO_STAGING_DEPLOYMENT_OR_ROLLBACK_BASELINE');
          const version=(list[0].versions||[]).find(x=>x.percentage===100||x.percentage===100.0)||list[0].versions?.[0];
          if(!version?.version_id && !version?.id)throw Error('STAGING_ROLLBACK_VERSION_NOT_FOUND');
          const id=version.version_id||version.id;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Pre-deploy staging rollback version: '+id+'\n');
          console.log('Pre-deploy staging rollback version recorded');
          NODE
      - name: Deploy exact verified commit to existing workers.dev STAGING Worker ONLY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_WORKER_API_TOKEN }}
          EXPECTED: ${{ needs.verify-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          # Cloudflare token MUST have only Workers Editor for this one Worker.
          # No D1 Edit grants, no routes or domains in wrangler.staging.toml.
          npx wrangler deploy --config wrangler.staging.toml
      - name: Read-only post-deploy health and unauthenticated OPS guard
        run: |
          set -euo pipefail
          base="https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev"
          curl --fail --silent --show-error --max-time 20 "$base/health" >/dev/null
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/api/ops/summary")
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "::error::Unauthenticated OPS unexpectedly returned HTTP $status"
            exit 1
          fi
          echo "### Worker-only STAGING deploy completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed candidate SHA: ${{ needs.verify-candidate.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No D1 writes, Gmail sync, external mail, Kustom or Stripe calls were initiated by this workflow." >> "$GITHUB_STEP_SUMMARY"
