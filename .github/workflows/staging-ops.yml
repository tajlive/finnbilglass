name: Staging OPS - manual release gate

# Auto-check edits to this workflow (NO Cloudflare access); staging writes
# remain manual and environment-gated.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-ops.yml
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional: leave blank to pin current PR #57 HEAD automatically"
        required: false
        default: ""
        type: string
      authorization:
        description: "Confirm staging-only run"
        required: true
        default: STAGING-ONLY
        type: choice
        options: [STAGING-ONLY]
      inspect_staging:
        description: "Read-only Cloudflare staging account / D1 identity and schema; no writes"
        required: true
        default: false
        type: boolean
      apply_migrations:
        description: "Apply explicitly reviewed 0040-0044 to staging D1"
        required: true
        default: false
        type: boolean
      bootstrap_admin_email:
        description: "Optional one-time STAGING admin email; requires apply_migrations=true and repo owner"
        required: false
        default: ""
        type: string
      deploy:
        description: "Deploy tested candidate to workers.dev staging ONLY"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: finnbilglass-staging-ops
  cancel-in-progress: false

jobs:
  verify-candidate:
    # Never let a pull-request cache write into a job that checks release candidates.
    cache-mode: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Verify manually entered SHA matches the exact open PR
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.candidate_sha }}
          AUTHORIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization || 'STAGING-ONLY' }}
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "STAGING-ONLY"
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/57")
          ACTUAL=$(echo "$PR" | jq -r .head.sha)
          if [ -z "$EXPECTED" ]; then
            EXPECTED="$ACTUAL"
            echo "Auto-pinned current PR #57 HEAD for this run"
          fi
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          BASE=$(echo "$PR" | jq -r .base.ref)
          HEAD=$(echo "$PR" | jq -r .head.ref)
          FORK=$(echo "$PR" | jq -r .head.repo.full_name)
          DRAFT=$(echo "$PR" | jq -r .draft)
          test "$EXPECTED" = "$ACTUAL"
          test "$BASE" = main
          test "$HEAD" = staging/first-sale-20261110
          test "$FORK" = "$GITHUB_REPOSITORY"
          test "$DRAFT" = true
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          EXPECTED: ${{ steps.pin.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa
      - name: Rehearse all five staging OPS migrations in ephemeral SQLite
        run: python3 scripts/maintenance/staging-migration-rehearsal.py
      - name: Compile exact staging Worker without deploying or Cloudflare credentials
        run: npx wrangler deploy --config wrangler.staging.toml --dry-run --outdir /tmp/fbg-staging-bundle
      - name: Safe validation summary
        if: ${{ github.event_name == 'push' || (!inputs.apply_migrations && !inputs.deploy) }}
        run: |
          {
            echo "### Staging preflight: PASS"
            echo "Reviewed PR #57 commit: ${{ steps.pin.outputs.sha }}"
            echo "No Cloudflare API access, D1 migration, Worker deploy, customer email, or payment was attempted."
            echo "Next: configure a dedicated staging GitHub environment before any DB/deploy step."
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    # No cache restore from PR code into a job carrying Cloudflare credentials.
    cache-mode: none
    needs: verify-candidate
    if: github.event_name == 'workflow_dispatch' && (inputs.inspect_staging || inputs.apply_migrations || inputs.deploy)
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Different name from production; never fall back to the repo-level prod token.
      # The Cloudflare token is NOT exposed to checkout/npm ci/QA steps.
      # Account ID is non-secret and pinned to the reviewed staging account.
      CLOUDFLARE_ACCOUNT_ID: "80d5b1d56a3e907150ba7348b6182894"
      STAGING_WORKER: finnbilglass-frontrute-staging
      STAGING_DB: finnbilglass-db-staging
      STAGING_DB_ID: 78842e17-ab0b-47c1-acde-244044073466
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail-closed account, Worker, D1 and config checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add STAGING_CLOUDFLARE_API_TOKEN to GitHub environment staging; production token must not be reused"
            exit 1
          fi
          test "$CLOUDFLARE_ACCOUNT_ID" = "80d5b1d56a3e907150ba7348b6182894"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const content=fs.readFileSync('wrangler.staging.toml','utf8');
          const expected={
            name:'finnbilglass-frontrute-staging',
            account_id:'80d5b1d56a3e907150ba7348b6182894',
            database_name:'finnbilglass-db-staging',
            database_id:'78842e17-ab0b-47c1-acde-244044073466',
            bucket_name:'finnbilglass-opplaering-staging'
          };
          const lines=new Set(content.split(String.fromCharCode(10)).map(x=>x.trim()));
          for(const [key,value] of Object.entries(expected)){
            if(!lines.has(key+' = "'+value+'"'))throw Error('Wrong staging '+key);
          }
          if(content.includes('[[routes]]')||content.includes('custom_domain = true'))throw Error('STAGING_HAS_PRODUCTION_ROUTE');
          NODE
          test -f migrations/proposed/0040_ops_manual_offer_order.sql.proposed
          test -f migrations/proposed/0041_ops_staff_invites_activity.sql.proposed
          test -f migrations/proposed/0042_ops_reply_outbox.sql.proposed
          test -f migrations/proposed/0043_ops_gmail_sync.sql.proposed
          test -f migrations/proposed/0044_ops_offer_outbox.sql.proposed
      - name: Verify Cloudflare API account and actual staging DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 info "$STAGING_DB" --config wrangler.staging.toml --json > /tmp/fbg-db-info.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('/tmp/fbg-db-info.json','utf8'));
          const db=Array.isArray(x)?x[0]:x;
          if(String(db.uuid||db.id||'')!==process.env.STAGING_DB_ID)throw Error('D1_ID_MISMATCH');
          if(db.name && db.name!==process.env.STAGING_DB)throw Error('D1_NAME_MISMATCH');
          if(db.version && db.version!=='production')throw Error('STAGING_D1_TIME_TRAVEL_NOT_SUPPORTED');
          console.log('Verified staging D1 identity, name, and backend');
          NODE
      - name: Inspect actual schema, without customer data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute "$STAGING_DB" --config wrangler.staging.toml --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('beta_inquiries','ops_manual_offers','ops_staff_memberships','ops_reply_outbox','ops_messages','ops_offer_outbox') ORDER BY name"
      - name: Record Time Travel restore point before any write
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        if: inputs.apply_migrations || inputs.deploy
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info "$STAGING_DB" --config wrangler.staging.toml --json > /tmp/fbg-bookmark.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bookmark=JSON.parse(fs.readFileSync('/tmp/fbg-bookmark.json','utf8'));
          const match=JSON.stringify(bookmark).match(/[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}/i);
          if(!match)throw Error('D1_BOOKMARK_MISSING');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Pre-write STAGING D1 restore bookmark: '+match[0]+String.fromCharCode(10));
          console.log('Staging D1 recovery bookmark recorded in protected release summary');
          NODE
      - name: Apply reviewed OPS migrations on STAGING only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        if: inputs.apply_migrations
        run: |
          set -euo pipefail
          # Explicit list: NEVER run the project's general migrations folder.
          # Idempotent CREATE IF NOT EXISTS; a partial failure stops before deploy.
          for n in 0040_ops_manual_offer_order 0041_ops_staff_invites_activity 0042_ops_reply_outbox 0043_ops_gmail_sync 0044_ops_offer_outbox; do
            npx wrangler d1 execute "$STAGING_DB" --config wrangler.staging.toml --remote --yes \
              --file "migrations/proposed/${n}.sql.proposed"
          done
      - name: Bootstrap first invited staging admin after verified migrations
        if: inputs.apply_migrations && inputs.bootstrap_admin_email != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          BOOTSTRAP_EMAIL: ${{ inputs.bootstrap_admin_email }}
        run: |
          set -euo pipefail
          # Only the repository owner can select the initial staging ADMIN.
          test "$GITHUB_ACTOR" = 'tajlive'
          EMAIL=$(printf '%s' "$BOOTSTRAP_EMAIL" | tr '[:upper:]' '[:lower:]')
          [[ "$EMAIL" =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,20}$ ]]
          # No SQL metacharacters are accepted; pre-existing memberships are never modified.
          npx wrangler d1 execute "$STAGING_DB" --config wrangler.staging.toml --remote --yes \
            --command "INSERT OR IGNORE INTO ops_staff_memberships(email,role,status,invited_by,invited_at) VALUES('$EMAIL','ADMIN','INVITED','github:staging-bootstrap',CAST(strftime('%s','now') AS INTEGER)*1000)"
          echo 'Initial staging ADMIN invitation seeded if the address was not already present.'
      - name: Require all staging OPS tables before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        if: inputs.deploy
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$STAGING_DB" --config wrangler.staging.toml --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('beta_inquiries','ops_manual_offers','ops_manual_orders','ops_staff_memberships','ops_staff_activity','ops_reply_outbox','ops_messages','ops_mail_sync_state','ops_offer_outbox')" > /tmp/fbg-ops-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('/tmp/fbg-ops-schema.json','utf8'));
          const names=new Set((Array.isArray(rows)?rows.flatMap(x=>x.results||[]):rows.results||[]).map(x=>x.name));
          for(const name of ['beta_inquiries','ops_manual_offers','ops_manual_orders','ops_staff_memberships','ops_staff_activity','ops_reply_outbox','ops_messages','ops_mail_sync_state','ops_offer_outbox']){
            if(!names.has(name))throw Error('MISSING_STAGING_TABLE_'+name);
          }
          console.log('Required staging OPS tables verified');
          NODE
      - name: Verify permanent Worker secrets exist before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        if: inputs.deploy
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.staging.toml --format json > /tmp/fbg-staging-secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const secrets=JSON.parse(fs.readFileSync('/tmp/fbg-staging-secrets.json','utf8'));
          const found=new Set((Array.isArray(secrets)?secrets:[]).map(x=>x.name));
          for(const name of ['OPS_ACCESS_TEAM_DOMAIN','OPS_ACCESS_AUD','RESEND_API_KEY']){
            if(!found.has(name))throw Error('MISSING_STAGING_WORKER_SECRET_'+name);
          }
          console.log('Cloudflare Access and Resend Worker secret names verified; values never printed');
          NODE
      - name: Deploy EXACT reviewed SHA to staging Worker (never prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        if: inputs.deploy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.verify-candidate.outputs.sha }}"
          npx wrangler deploy --config wrangler.staging.toml
      - name: Read-only staging health check
        if: inputs.deploy
        run: curl --fail --silent --show-error --max-time 20 "https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev/health"
      - name: Release record
        run: |
          {
            echo "### FinnBilGlass staging-only release"
            echo "Candidate SHA: ${{ needs.verify-candidate.outputs.sha }}"
            echo 'D1: finnbilglass-db-staging'
            echo "Migrations requested: ${{ inputs.apply_migrations }}"
            echo "Read-only inspection requested: ${{ inputs.inspect_staging }}"
            echo "First admin invitation requested: ${{ inputs.apply_migrations && inputs.bootstrap_admin_email != '' }}"
            echo "Deploy requested: ${{ inputs.deploy }}"
            echo "This workflow does not create test sales, send email or initiate payments."
          } >> "$GITHUB_STEP_SUMMARY"
