name: FinnBilGlass - repair missing staging feature flags once

# Only the isolated EU staging D1 and missing feature_flags table.
# No production D1/Worker, email, payments, staff roles, or customer rows.
on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-feature-flags-repair-once.yml]

permissions:
  contents: read

concurrency:
  group: finnbilglass-staging-feature-flags-one-time
  cancel-in-progress: false

jobs:
  repair-staging-only:
    if: github.repository == 'tajlive/finnbilglass' && github.actor == 'tajlive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Wrangler and rehearse missing SQL locally WITHOUT token
        run: |
          set -euo pipefail
          npm ci
          python3 - <<'PY'
          import sqlite3,pathlib
          sql=pathlib.Path('migrations/0005_feature_flags.sql').read_text()
          assert 'CREATE TABLE IF NOT EXISTS feature_flags' in sql
          db=sqlite3.connect(':memory:')
          db.executescript(sql)
          db.execute("INSERT OR IGNORE INTO feature_flags(flag,enabled,note) VALUES('inquiries_enabled',1,'Synthetic staging E2E')")
          assert db.execute("SELECT COUNT(*) FROM feature_flags").fetchone()[0]>=7
          assert db.execute("SELECT enabled FROM feature_flags WHERE flag='inquiries_enabled'").fetchone()[0]==1
          print('PASS: migration and explicit staging intake flag work locally')
          PY
      - name: Verify exact EU staging D1, backup, install only missing feature_flags
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80d5b1d56a3e907150ba7348b6182894
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json,os,urllib.request
          a='80d5b1d56a3e907150ba7348b6182894'
          u='78842e17-ab0b-47c1-acde-244044073466'
          req=urllib.request.Request(
            f'https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{u}',
            headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']},
            method='GET')
          with urllib.request.urlopen(req,timeout=20) as r:res=json.load(r)
          d=res.get('result') or {}
          if not res.get('success') or d.get('uuid')!=u or d.get('name')!='finnbilglass-db-staging' or d.get('jurisdiction')!='eu':
            raise SystemExit('STOP: wrong staging D1 identity or jurisdiction')
          print('PASS: exact isolated EU staging DB confirmed')
          PY
          cat > "$RUNNER_TEMP/fbg-feature-flag-stage.toml" <<'TOML'
          name = "fbg-staging-feature-flags-only"
          account_id = "80d5b1d56a3e907150ba7348b6182894"
          [[d1_databases]]
          binding = "FINNBILGLASS_DB"
          database_name = "finnbilglass-db-staging"
          database_id = "78842e17-ab0b-47c1-acde-244044073466"
          TOML
          CFG="$RUNNER_TEMP/fbg-feature-flag-stage.toml"
          DB="finnbilglass-db-staging"
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='feature_flags'" > "$RUNNER_TEMP/fbg-flags-before.json"
          python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-flags-before.json'))
          items=data if isinstance(data,list) else [data]
          v=[r.get('n') for o in items for r in o.get('results',[])]
          if v!=[0]: raise SystemExit('STOP: flags table already exists, review schema instead')
          print('PASS: required table absent, no existing feature flags to overwrite')
          PY
          npx wrangler d1 time-travel info "$DB" --config "$CFG" --json > "$RUNNER_TEMP/fbg-flags-bookmark.json"
          python3 - <<'PY'
          import json,os,re
          payload=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-flags-bookmark.json'))
          match=re.search(r'[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}',json.dumps(payload),re.I)
          if not match:raise SystemExit('STOP: no D1 restore bookmark')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('EU staging D1 pre-feature-flags restore bookmark: '+match.group(0)+chr(10))
          print('PASS: D1 Time Travel bookmark recorded before mutation')
          PY
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --yes \
            --file migrations/0005_feature_flags.sql >/dev/null
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --yes \
            --command "INSERT OR IGNORE INTO feature_flags(flag,enabled,note) VALUES('inquiries_enabled',1,'Staging synthetic customer flow allowed for QA')" >/dev/null
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json \
            --command "SELECT COUNT(*) AS total, SUM(CASE WHEN flag='inquiries_enabled' AND enabled=1 THEN 1 ELSE 0 END) AS intake_ready FROM feature_flags" > "$RUNNER_TEMP/fbg-flags-after.json"
          python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-flags-after.json'))
          rows=[r for item in (data if isinstance(data,list) else [data])
                 for r in item.get('results',[])]
          if len(rows)!=1 or rows[0].get('total',0)<7 or rows[0].get('intake_ready')!=1:
            raise SystemExit('STOP: staging flags not installed/verified')
          print('PASS: staging feature_flags and inquiries_enabled=1 verified')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('PASS: feature_flags table restored from reviewed 0005 migration; synthetic intake explicitly enabled.'+chr(10))
            f.write('No Worker deploy, customer import, email or payment.'+chr(10))
          PY
