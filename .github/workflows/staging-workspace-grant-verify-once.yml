name: FinnBilGlass - verify encrypted Workspace grant in isolated staging (read-only)
on:
  push:
    branches: [staging/first-sale-20261110]
    paths: [.github/workflows/staging-workspace-grant-verify-once.yml]
permissions:
  contents: read
concurrency:
  group: fbg-one-time-workspace-grant-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'tajlive/finnbilglass' && github.ref == 'refs/heads/staging/first-sale-20261110' && github.actor == 'tajlive'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Staging EU D1 grant status only - never read token bytes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          t=os.environ.get('CF_TOKEN','')
          if not t:raise SystemExit('STOP: read-only staging inspection token unavailable')
          account='80d5b1d56a3e907150ba7348b6182894'
          dbid='78842e17-ab0b-47c1-acde-244044073466'
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}'
          headers={'Authorization':'Bearer '+t,'Content-Type':'application/json'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:data=json.loads(r.read(160000))
            if not data.get('success'):raise SystemExit('STOP: Cloudflare API error')
            return data['result']
          d=get(base)
          if d.get('name')!='finnbilglass-db-staging' or d.get('uuid')!=dbid or d.get('jurisdiction')!='eu':
            raise SystemExit('STOP: expected isolated EU staging D1 not verified')
          def q(sql):
            req=urllib.request.Request(base+'/query',method='POST',headers=headers,data=json.dumps({'sql':sql}).encode())
            with urllib.request.urlopen(req,timeout=20) as r:data=json.loads(r.read(160000))
            if not data.get('success'):raise SystemExit('STOP: staging query error')
            rows=[row for batch in data['result'] for row in batch.get('results',[])]
            if len(rows)!=1:raise SystemExit('STOP: query cardinality unexpected')
            return rows[0]
          grant=q("SELECT COUNT(*) AS total,SUM(CASE WHEN id='primary' AND status='ACTIVE' AND mailbox='tomarne@finnbilglass.no' AND scope='https://www.googleapis.com/auth/gmail.readonly' AND LENGTH(refresh_ciphertext)>50 THEN 1 ELSE 0 END) AS matching FROM ops_workspace_gmail_tokens")
          audit=q("SELECT COUNT(*) AS connected FROM ops_workspace_oauth_audit WHERE action='CONNECTED' AND mailbox='tomarne@finnbilglass.no'")
          status=q("SELECT COUNT(*) AS rows FROM ops_mail_sync_state WHERE channel='gmail_sync' AND last_success IS NOT NULL")
          print('Verified isolated EU staging D1 (no production access)')
          print(f"GRANT_TOTAL={grant['total']}")
          print(f"GRANT_MATCHING_ACTIVE_ENCRYPTED={grant['matching'] or 0}")
          print(f"OAUTH_CONNECTED_AUDIT={audit['connected']}")
          print(f"GMAIL_SUCCESSFUL_IMPORT_CURSOR_ROWS={status['rows']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write('### Workspace Gmail read-only staging grant verification\n')
            out.write(f"Isolated EU D1: yes. Active matching encrypted grant: {grant['matching'] or 0} of {grant['total']}. Connected audits: {audit['connected']}. Import cursors: {status['rows']}.\n")
            out.write('No refresh token or message data was selected or logged. No Gmail import or production mutation was performed.\n')
          if int(grant['matching'] or 0)!=1 or int(grant['total'])!=1 or int(audit['connected'])<1:
            raise SystemExit('FAIL: no verified isolated Workspace Gmail read-only grant')
          PY
