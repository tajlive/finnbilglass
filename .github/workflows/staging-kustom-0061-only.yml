# Single-purpose staging schema migration, protected by explicit SHA and Time Travel.
# Mutates staging schema ONLY; no production, orders, captures, refunds, or deploys.
name: Fast-track STAGING Kustom 0061 only
on:
  push:
    branches: ['release/fbg-main-fastlane-20261109']
    paths: ['.github/workflows/staging-kustom-0061-only.yml']
permissions:
  contents: read
concurrency:
  group: fbg-staging-migration-0061
  cancel-in-progress: false
jobs:
  migrate:
    name: Apply staging-only bookkeeping table
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail closed on wrong migration or wrong D1 binding
        run: |
          set -euo pipefail
          test "$(git hash-object migrations/staging-auth/0061_kustom_reconciliation_attempts.sql)" = "5e7377657cd88a72be3881cffd729a1a3446556e"
          node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.toml','utf8');const q=t.split('[[env.staging.d1_databases]]').slice(1).find(s=>s.includes('FINNBILGLASS_STAGING_AUTH'));if(!q||!q.includes('finnbilglass-staging-auth')||!q.includes('0b024ab6-4e9c-4fda-ab19-439e11e631fb'))process.exit(7)"
          echo "Verified exact 0061 content and staging auth database"
      - name: Check database columns and current 0061 state (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --no-install wrangler d1 execute finnbilglass-staging-auth --env staging --remote --command="SELECT name FROM pragma_table_info('quote_payment_orders')" --json > "$RUNNER_TEMP/fbg-0061-pre-orders.json"
          npx --no-install wrangler d1 execute finnbilglass-staging-auth --env staging --remote --command="SELECT name FROM pragma_table_info('kustom_reconcile_attempts')" --json > "$RUNNER_TEMP/fbg-0061-pre-existing.json"
          node scripts/maintenance/staging-0061-verify.mjs pre "$RUNNER_TEMP/fbg-0061-pre-orders.json" "$RUNNER_TEMP/fbg-0061-pre-existing.json"
      - name: Confirm Time Travel bookmark exists (bookmark never logged)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 time-travel info finnbilglass-staging-auth --env staging --json > "$RUNNER_TEMP/fbg-0061-before.json"
          node scripts/maintenance/d1-readonly-summary.mjs "$RUNNER_TEMP/fbg-0061-before.json" timetravel
      - name: Apply ONLY fixed, idempotent 0061 bookkeeping schema to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute finnbilglass-staging-auth --env staging --remote --file=migrations/staging-auth/0061_kustom_reconciliation_attempts.sql --yes --json > "$RUNNER_TEMP/fbg-0061-apply-metrics.json"
          echo "Submitted 0061 to staging only; no production bindings or flags changed"
      - name: Verify new staging table and cooldown index (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute finnbilglass-staging-auth --env staging --remote --command="SELECT name FROM pragma_table_info('kustom_reconcile_attempts')" --json > "$RUNNER_TEMP/fbg-0061-post-columns.json"
          npx --no-install wrangler d1 execute finnbilglass-staging-auth --env staging --remote --command="SELECT name FROM sqlite_master WHERE type='index' AND name='idx_kustom_reconcile_attempts_checked'" --json > "$RUNNER_TEMP/fbg-0061-post-index.json"
          node scripts/maintenance/staging-0061-verify.mjs post "$RUNNER_TEMP/fbg-0061-post-columns.json" "$RUNNER_TEMP/fbg-0061-post-index.json"
