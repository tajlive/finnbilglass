name: FinnBilGlass - one-time first staging admin invite

# One-time D1-only bootstrap for verified fresh EU staging schema.
# No production DB, no Worker deploy, no Access policy writes, no email.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-first-admin-once.yml

permissions:
  contents: read

jobs:
  first-staging-admin:
    if: github.repository == 'tajlive/finnbilglass' && github.ref == 'refs/heads/main' && github.actor == 'tajlive'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trusted pinned Wrangler before secret exposure
        run: npm ci
      - name: Pin exact EU staging D1, record bookmark, invite first admin only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "80d5b1d56a3e907150ba7348b6182894"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json,os,urllib.request
          a='80d5b1d56a3e907150ba7348b6182894'
          u='78842e17-ab0b-47c1-acde-244044073466'
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{a}/d1/database/{u}',
              headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=15) as response:
              data=json.loads(response.read(16384))
          r=data.get('result') or {}
          if not data.get('success') or r.get('uuid')!=u or r.get('name')!='finnbilglass-db-staging' or r.get('jurisdiction')!='eu':
              raise SystemExit('STOP: unexpected D1 identity/jurisdiction')
          print('Exact isolated EU staging DB identity verified')
          PY
          cat > "$RUNNER_TEMP/fbg-admin-bootstrap.toml" <<'TOML'
          name = "fbg-first-admin-schema-bootstrap"
          account_id = "80d5b1d56a3e907150ba7348b6182894"
          [[d1_databases]]
          binding = "FINNBILGLASS_DB"
          database_name = "finnbilglass-db-staging"
          database_id = "78842e17-ab0b-47c1-acde-244044073466"
          TOML
          CFG="$RUNNER_TEMP/fbg-admin-bootstrap.toml"
          DB=finnbilglass-db-staging
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json \
            --command "SELECT COUNT(*) AS n FROM ops_staff_memberships" > "$RUNNER_TEMP/fbg-staff-before.json"
          python3 - <<'PY'
          import json,os
          a=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-staff-before.json'))
          rows=a if isinstance(a,list) else [a]
          counts=[r.get('n') for x in rows for r in x.get('results',[])]
          if counts != [0]:
              raise SystemExit('STOP: first admin seed requires zero pre-existing staff')
          print('First admin seed: verified staging memberships empty')
          PY
          npx wrangler d1 time-travel info "$DB" --config "$CFG" --json > "$RUNNER_TEMP/fbg-admin-bookmark.json"
          python3 - <<'PY'
          import json,os,re
          data=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-admin-bookmark.json'))
          match=re.search(r'[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}',json.dumps(data),re.I)
          if not match: raise SystemExit('STOP: no pre-admin D1 recovery bookmark')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Pre-admin EU staging D1 recovery bookmark: '+match.group(0)+chr(10))
          PY
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --yes \
            --command "INSERT OR IGNORE INTO ops_staff_memberships(email,role,status,invited_by,invited_at) VALUES('tomarnejensen@gmail.com','ADMIN','INVITED','github:one-time-staging-setup',CAST(strftime('%s','now') AS INTEGER)*1000)"
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json \
            --command "SELECT role,status,COUNT(*) AS n FROM ops_staff_memberships GROUP BY role,status" > "$RUNNER_TEMP/fbg-admin-after.json"
          python3 - <<'PY'
          import json,os
          a=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-admin-after.json'))
          rows=a if isinstance(a,list) else [a]
          actual=[(r.get('role'),r.get('status'),r.get('n')) for x in rows for r in x.get('results',[])]
          if actual != [('ADMIN','INVITED',1)]:
              raise SystemExit('STOP: staging initial admin invitation verification failed')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('First staging ADMIN invited in isolated EU D1 (no email sent).')
          print('PASS: exactly one first staging admin invited, no other users changed')
          PY
