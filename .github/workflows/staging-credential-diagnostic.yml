name: FinnBilGlass - staging credential diagnostic

# A deliberately read-only diagnostic. Never checkout PR code, run npm scripts,
# change GitHub secrets, query customer rows, migrate D1, or deploy a Worker.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-credential-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-existing-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Inspect known existing token names via read-only D1 API
        env:
          FBG_STAGING_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          FBG_EXISTING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FBG_ALTERNATE_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = ("https://api.cloudflare.com/client/v4/accounts/"
                 "80d5b1d56a3e907150ba7348b6182894/"
                 "d1/database/6c8c3eeb-e4bb-41c7-831f-25e5a735717c")
          expected = "6c8c3eeb-e4bb-41c7-831f-25e5a735717c"
          entries = (
              ("dedicated staging", "FBG_STAGING_TOKEN"),
              ("existing repository token", "FBG_EXISTING_TOKEN"),
              ("alternate CF token", "FBG_ALTERNATE_TOKEN")
          )
          notes = [
              "### Cloudflare staging credential diagnostic (read-only)",
              "Only one GET of staging D1 metadata per configured token was attempted.",
              "No token values, customer data, database writes or deploy operations."
          ]
          read_only_checks = (
              ("token status", "https://api.cloudflare.com/client/v4/user/tokens/verify"),
              ("account D1 listing",
               "https://api.cloudflare.com/client/v4/accounts/"
               "80d5b1d56a3e907150ba7348b6182894/d1/database?per_page=1"),
              ("specific staging D1", url)
          )
          for label, variable in entries:
              token = os.environ.get(variable, "")
              if not token:
                  print(f"{label}: NOT CONFIGURED")
                  notes.append(f"- {label}: not configured")
                  continue
              for check, endpoint in read_only_checks:
                  request = urllib.request.Request(endpoint, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json"
                  }, method="GET")
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          body = json.loads(response.read(16384))
                      result = body.get("result") or {}
                      if check == "specific staging D1":
                          valid = (body.get("success") is True and
                                   str(result.get("uuid", "")) == expected)
                      else:
                          valid = body.get("success") is True
                      outcome = "READ-OK" if valid else "NO CONFIRMED ACCESS"
                  except urllib.error.HTTPError as err:
                      outcome = f"HTTP-{err.code}"
                  except Exception:
                      outcome = "NETWORK OR JSON ERROR"
                  print(f"{label} / {check}: {outcome}")
                  notes.append(f"- {label} / {check}: {outcome}")
          # Filter by database name only; never query or display customer rows.
          existing = os.environ.get("FBG_EXISTING_TOKEN", "")
          if existing:
              endpoint = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  "80d5b1d56a3e907150ba7348b6182894/"
                  "d1/database?name=finnbilglass-db-staging&per_page=100"
              )
              request = urllib.request.Request(endpoint, headers={
                  "Authorization": "Bearer " + existing,
                  "Accept": "application/json"
              }, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = json.loads(response.read(65536))
                  found = body.get("result") or []
                  if not isinstance(found, list):
                      found = []
                  matches = [
                      str(item.get("uuid", ""))
                      for item in found
                      if item.get("name") == "finnbilglass-db-staging"
                  ]
                  if matches:
                      for uuid in matches:
                          outcome = (
                              "EXPECTED-ID" if uuid == expected else
                              "DIFFERENT-ID (review staging config)"
                          )
                          print(f"named staging database: {outcome} {uuid}")
                          notes.append(f"- named staging D1: {outcome}, uuid {uuid}")
                  else:
                      print("named staging database: NOT FOUND in authorized D1 listing")
                      notes.append("- named staging D1: not found in authorized D1 listing")
              except urllib.error.HTTPError as err:
                  print(f"named staging database lookup: HTTP-{err.code}")
                  notes.append(f"- named staging lookup: HTTP-{err.code}")
              except Exception:
                  print("named staging database lookup: network/JSON error")
                  notes.append("- named staging lookup: network/JSON error")
          notes.append("Do not reuse an existing production-scoped token for staging writes; provision a dedicated least-privilege token for release.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(notes) + "\n")
          PY
