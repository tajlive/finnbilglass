name: FinnBilGlass - staging credential diagnostic

# A deliberately read-only diagnostic. Never checkout PR code, run npm scripts,
# change GitHub secrets, query customer rows, migrate D1, or deploy a Worker.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/staging-credential-diagnostic.yml]

permissions:
  contents: read

jobs:
  inspect-existing-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Inspect known existing token names via read-only D1 API
        env:
          FBG_STAGING_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          FBG_EXISTING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FBG_ALTERNATE_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = ("https://api.cloudflare.com/client/v4/accounts/"
                 "80d5b1d56a3e907150ba7348b6182894/"
                 "d1/database/78842e17-ab0b-47c1-acde-244044073466")
          expected = "78842e17-ab0b-47c1-acde-244044073466"
          entries = (
              ("dedicated staging", "FBG_STAGING_TOKEN"),
              ("existing repository token", "FBG_EXISTING_TOKEN"),
              ("alternate CF token", "FBG_ALTERNATE_TOKEN")
          )
          notes = [
              "### Cloudflare staging credential diagnostic (read-only)",
              "Only one GET of staging D1 metadata per configured token was attempted.",
              "No token values, customer data, database writes or deploy operations."
          ]
          read_only_checks = (
              ("token status", "https://api.cloudflare.com/client/v4/user/tokens/verify"),
              ("account D1 listing",
               "https://api.cloudflare.com/client/v4/accounts/"
               "80d5b1d56a3e907150ba7348b6182894/d1/database?per_page=1"),
              ("specific staging D1", url)
          )
          for label, variable in entries:
              token = os.environ.get(variable, "")
              if not token:
                  print(f"{label}: NOT CONFIGURED")
                  notes.append(f"- {label}: not configured")
                  continue
              for check, endpoint in read_only_checks:
                  request = urllib.request.Request(endpoint, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json"
                  }, method="GET")
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          body = json.loads(response.read(16384))
                      result = body.get("result") or {}
                      if check == "specific staging D1":
                          valid = (body.get("success") is True and
                                   str(result.get("uuid", "")) == expected)
                      else:
                          valid = body.get("success") is True
                      outcome = "READ-OK" if valid else "NO CONFIRMED ACCESS"
                  except urllib.error.HTTPError as err:
                      outcome = f"HTTP-{err.code}"
                  except Exception:
                      outcome = "NETWORK OR JSON ERROR"
                  print(f"{label} / {check}: {outcome}")
                  notes.append(f"- {label} / {check}: {outcome}")
          # Filter by database name only; never query or display customer rows.
          existing = os.environ.get("FBG_EXISTING_TOKEN", "")
          if existing:
              endpoint = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  "80d5b1d56a3e907150ba7348b6182894/"
                  "d1/database?name=finnbilglass-db-staging&per_page=100"
              )
              request = urllib.request.Request(endpoint, headers={
                  "Authorization": "Bearer " + existing,
                  "Accept": "application/json"
              }, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = json.loads(response.read(65536))
                  found = body.get("result") or []
                  if not isinstance(found, list):
                      found = []
                  matches = [
                      str(item.get("uuid", ""))
                      for item in found
                      if item.get("name") == "finnbilglass-db-staging"
                  ]
                  if matches:
                      for uuid in matches:
                          outcome = (
                              "EXPECTED-ID" if uuid == expected else
                              "DIFFERENT-ID (review staging config)"
                          )
                          print(f"named staging database: {outcome} {uuid}")
                          notes.append(f"- named staging D1: {outcome}, uuid {uuid}")
                  else:
                      print("named staging database: NOT FOUND in authorized D1 listing")
                      notes.append("- named staging D1: not found in authorized D1 listing")
              except urllib.error.HTTPError as err:
                  print(f"named staging database lookup: HTTP-{err.code}")
                  notes.append(f"- named staging lookup: HTTP-{err.code}")
              except Exception:
                  print("named staging database lookup: network/JSON error")
                  notes.append("- named staging lookup: network/JSON error")
          if existing:
              # Final read-only discovery: identify whether this credential can see
              # a real FinnBilGlass D1 resource, without querying any user records.
              endpoint = ("https://api.cloudflare.com/client/v4/accounts/"
                          "80d5b1d56a3e907150ba7348b6182894/"
                          "d1/database?per_page=100")
              req = urllib.request.Request(endpoint, headers={
                  "Authorization": "Bearer " + existing, "Accept": "application/json"
              }, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=15) as res:
                      data = json.loads(res.read(200000))
                  rows = data.get("result") if isinstance(data.get("result"), list) else []
                  # Only print DB name+UUID when already in the publicly declared
                  # FinnBilGlass family. No other Cloudflare resources are revealed.
                  visible = [(str(x.get("name","")),str(x.get("uuid","")))
                             for x in rows if str(x.get("name","")).startswith("finnbilglass")]
                  print(f"visible D1 metadata rows on first page: {len(rows)}")
                  notes.append(f"- visible D1 metadata rows (first page): {len(rows)}")
                  for name,uuid in visible:
                      print(f"visible FinnBilGlass D1: {name} {uuid}")
                      notes.append(f"- visible FinnBilGlass D1: {name} ({uuid})")
              except urllib.error.HTTPError as err:
                  print(f"unfiltered D1 list: HTTP-{err.code}")
              except Exception:
                  print("unfiltered D1 list: NETWORK OR JSON ERROR")
          notes.append("Do not reuse an existing production-scoped token for staging writes; provision a dedicated least-privilege token for release.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(notes) + "\n")
          PY

      - name: Inspect staging Worker secret names and Access app availability (read-only)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('TOKEN')
          if not key: raise SystemExit('No existing Cloudflare credential')
          account='80d5b1d56a3e907150ba7348b6182894'
          base='https://api.cloudflare.com/client/v4'
          endpoints=[
            ('staging Worker secret names',f'{base}/accounts/{account}/workers/scripts/finnbilglass-frontrute-staging/secrets'),
            ('Access applications',f'{base}/accounts/{account}/access/apps?per_page=100')
          ]
          notes=['### Read-only staging Worker / Access readiness']
          for label,url in endpoints:
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+key,'Accept':'application/json'},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=15) as rsp: data=json.loads(rsp.read(200000))
              result=data.get('result')
              if not data.get('success'):
                outcome='API returned non-success'
              elif label=='staging Worker secret names':
                items=result if isinstance(result,list) else (result or {}).get('secrets',[])
                names={str(x.get('name','')) for x in items if isinstance(x,dict)}
                required={'OPS_ACCESS_TEAM_DOMAIN','OPS_ACCESS_AUD','RESEND_API_KEY'}
                outcome='REQUIRED_PRESENT' if required<=names else 'MISSING_REQUIRED_NAMES'
                print(f'{label}: {outcome}; expected={sorted(required)}; missing={sorted(required-names)}')
                notes.append(f'- {label}: {outcome}, missing={sorted(required-names)}')
              else:
                items=result if isinstance(result,list) else []
                found=[(str(x.get('name','')),str(x.get('domain','')),str(x.get('aud','')))
                       for x in items if isinstance(x,dict) and 'finnbilglass' in str(x.get('name','')).lower()]
                outcome=f'{len(found)} matching Access apps'
                print(f'{label}: {outcome}')
                for name,domain,aud in found:
                  print(f'Access app: {name} | domain={domain} | AUD={aud}')
                notes.append(f'- {label}: {outcome}')
            except urllib.error.HTTPError as e:
              outcome=f'HTTP-{e.code}'
              print(f'{label}: {outcome}')
              notes.append(f'- {label}: {outcome}')
            except Exception:
              outcome='NETWORK OR JSON ERROR'
              print(f'{label}: {outcome}')
              notes.append(f'- {label}: {outcome}')
          url='https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev/health'
          try:
            req=urllib.request.Request(url,headers={'Accept':'application/json'},method='GET')
            with urllib.request.urlopen(req,timeout=15) as rsp:
              status=rsp.status
          except urllib.error.HTTPError as e: status=e.code
          except Exception: status='network error'
          print(f'Staging public health GET: {status}')
          notes.append(f'- staging public health GET: {status}')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(chr(10).join(notes)+chr(10))
          PY
