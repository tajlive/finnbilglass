name: FinnBilGlass - staging credential diagnostic

# A deliberately read-only diagnostic. Never checkout PR code, run npm scripts,
# change GitHub secrets, query customer rows, migrate D1, or deploy a Worker.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-credential-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-existing-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Inspect known existing token names via read-only D1 API
        env:
          FBG_STAGING_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          FBG_EXISTING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FBG_ALTERNATE_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = ("https://api.cloudflare.com/client/v4/accounts/"
                 "80d5b1d56a3e907150ba7348b6182894/"
                 "d1/database/6c8c3eeb-e4bb-41c7-831f-25e5a735717c")
          expected = "6c8c3eeb-e4bb-41c7-831f-25e5a735717c"
          entries = (
              ("dedicated staging", "FBG_STAGING_TOKEN"),
              ("existing repository token", "FBG_EXISTING_TOKEN"),
              ("alternate CF token", "FBG_ALTERNATE_TOKEN")
          )
          notes = [
              "### Cloudflare staging credential diagnostic (read-only)",
              "Only one GET of staging D1 metadata per configured token was attempted.",
              "No token values, customer data, database writes or deploy operations."
          ]
          for label, variable in entries:
              token = os.environ.get(variable, "")
              if not token:
                  print(f"{label}: NOT CONFIGURED")
                  notes.append(f"- {label}: not configured")
                  continue
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json"
              }, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = json.loads(response.read(8192))
                  result = body.get("result") or {}
                  valid = (body.get("success") is True and
                           str(result.get("uuid", "")) == expected)
                  outcome = "READ-OK" if valid else "UNEXPECTED D1 ID"
              except urllib.error.HTTPError as err:
                  outcome = f"HTTP-{err.code}"
              except Exception:
                  outcome = "NETWORK OR JSON ERROR"
              print(f"{label}: {outcome}")
              notes.append(f"- {label}: {outcome}")
          notes.append("Do not reuse an existing production-scoped token for staging writes; provision a dedicated least-privilege token for release.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(notes) + "\n")
          PY
