name: FinnBilGlass - one-time isolated staging D1 provisioning

# Creates ONLY finnbilglass-db-staging if absent. Never touches existing
# D1 databases, copies customer data, runs migrations or deploys Workers.
# One-time bootstrap using existing repository token; NOT a permanent
# fallback for staging releases. Use a dedicated environment token for release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-staging-d1-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finnbilglass-staging-d1-provision-once
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'tajlive/finnbilglass' && github.ref == 'refs/heads/main' && github.actor == 'tajlive'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing database or create exactly one EU staging D1
        env:
          BOOTSTRAP_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          ACCOUNT = "80d5b1d56a3e907150ba7348b6182894"
          NAME = "finnbilglass-db-staging"
          TOKEN = os.environ.get("BOOTSTRAP_CLOUDFLARE_TOKEN", "")
          if not TOKEN:
              raise SystemExit("No existing Cloudflare bootstrap credential")
          URL = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/d1/database"
          headers = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/json",
              "Content-Type": "application/json"
          }
          def call(url, method="GET", data=None):
              request = urllib.request.Request(url, headers=headers,
                                               data=data, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.loads(response.read(32768))
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Cloudflare {method} failed: HTTP-{error.code}") from None
          # Idempotency: never try to create a database of an existing name.
          current = call(URL + "?name=" + NAME + "&per_page=100")
          if not current.get("success"):
              raise SystemExit("Cloudflare D1 name lookup failed")
          matches = [x for x in current.get("result", [])
                     if x.get("name") == NAME]
          if len(matches) > 1:
              raise SystemExit("Multiple staging D1 name matches; manual resolution required")
          if matches:
              db = matches[0]
              action = "EXISTING"
          else:
              payload = json.dumps({
                  "name": NAME, "jurisdiction": "eu",
                  "read_replication": {"mode": "disabled"}
              }).encode()
              result = call(URL, method="POST", data=payload)
              if not result.get("success"):
                  raise SystemExit("Cloudflare refused staging D1 creation")
              db = result.get("result") or {}
              action = "CREATED"
          uuid = str(db.get("uuid", ""))
          if len(uuid) != 36 or db.get("name") != NAME:
              raise SystemExit("Missing or incorrect D1 creation response")
          proof = call(URL + "/" + uuid)
          if (not proof.get("success") or
              (proof.get("result") or {}).get("name") != NAME):
              raise SystemExit("Post-create D1 metadata check failed")
          print(f"{action}: {NAME}, UUID={uuid}, jurisdiction={db.get('jurisdiction','unknown')}")
          notes = [
              "### Isolated FinnBilGlass staging D1 bootstrap",
              f"Result: {action}",
              f"Database: {NAME}",
              f"UUID: {uuid}",
              f"Jurisdiction: {db.get('jurisdiction','unknown')}",
              "No existing database modified; no rows, migrations, secret writes or deploys.",
              "Next: update staged config and release UUID to the returned value; add dedicated staging secret."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(notes)+"\n")
          PY
