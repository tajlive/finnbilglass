name: FinnBilGlass - one-time synthetic staging customer journey

# Re-run after verified 0005 feature_flags repair (staging D1 only).
# Real staging endpoint test, but no real customer data, email, payment or
# production writes. Synthetic contact uses reserved .invalid TLD.
on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-synthetic-inquiry-once.yml]

permissions:
  contents: read

jobs:
  single-synthetic-inquiry:
    if: github.repository == 'tajlive/finnbilglass' && github.ref == 'refs/heads/main' && github.actor == 'tajlive'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Submit one synthetic customer inquiry through staging Worker and verify idempotency
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os
          host='https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev'
          key='fbg-staging-synthetic-inquiry-20261110-qa01'
          body={
            'regnr':'',
            'navn':'Staging QA syntetisk',
            'kontakt':'qa-inquiry-20261110@example.invalid',
            'melding':'SYNTHETIC STAGING ONLY: no real glass, shipping, invoice, email or payment',
            'sessionId':'staging-qa-first-sale-20261110'
          }
          def submit(data):
            req=urllib.request.Request(host+'/api/inquiry',
                data=json.dumps(data).encode('utf8'),method='POST',
                headers={'Content-Type':'application/json','Accept':'application/json',
                  'Idempotency-Key':key,'User-Agent':'FinnBilGlass-Staging-Synthetic-Test/1'})
            try:
              with urllib.request.urlopen(req,timeout=20) as rsp:
                return rsp.status,json.loads(rsp.read(16384))
            except urllib.error.HTTPError as e:
              try: payload=json.loads(e.read(16384))
              except Exception:payload={}
              return e.code,payload
          code,response=submit(body)
          if code!=201 or not response.get('ok') or not isinstance(response.get('inquiryId'),int):
            raise SystemExit('FAIL: synthetic submission returned HTTP '+str(code)+' '+str(response.get('error','')))
          iid=response['inquiryId']
          code,replay=submit(body)
          if code!=201 or replay.get('inquiryId')!=iid or replay.get('idempotent') is not True:
            raise SystemExit('FAIL: idempotent replay did not return same inquiry')
          conflict=dict(body);conflict['melding']='SYNTHETIC STAGING: different request, same idempotency key'
          code,bad=submit(conflict)
          if code!=409:
            raise SystemExit('FAIL: different body with same key returned '+str(code)+' (expected 409)')
          with open(os.environ['RUNNER_TEMP']+'/staging-synthetic-iid.txt','w') as f:
            f.write(str(iid))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### First synthetic staging inquiry'+chr(10))
            f.write(f'Customer request ID: {iid}'+chr(10))
            f.write('PASS: first POST 201, identical retry same ID, modified body 409.'+chr(10))
            f.write('Synthetic .invalid address, no vehicle registration. No email, order or payment requests.'+chr(10))
          print('PASS: staging customer inquiry accepted once as ID '+str(iid))
          print('PASS: identical request replayed with same inquiry ID')
          print('PASS: altered request rejected with HTTP 409')
          PY
      - name: Verify staging D1 has exactly one synthetic inquiry, event and no automatic orders
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          aid='80d5b1d56a3e907150ba7348b6182894'
          uid='78842e17-ab0b-47c1-acde-244044073466'
          tok=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not tok:raise SystemExit('FAIL: no Cloudflare auth for staging D1 verification')
          base=f'https://api.cloudflare.com/client/v4/accounts/{aid}/d1/database/{uid}'
          def api(path,payload=None):
            data=json.dumps(payload).encode() if payload is not None else None
            h={'Authorization':'Bearer '+tok,'Accept':'application/json'}
            if data:h['Content-Type']='application/json'
            req=urllib.request.Request(base+path,method='POST' if data else 'GET',headers=h,data=data)
            with urllib.request.urlopen(req,timeout=20) as rsp:out=json.loads(rsp.read(32000))
            if not out.get('success'):raise SystemExit('FAIL: Cloudflare D1 API returned non-success')
            return out.get('result')
          db=api('') or {}
          if db.get('uuid')!=uid or db.get('name')!='finnbilglass-db-staging' or db.get('jurisdiction')!='eu':
            raise SystemExit('FAIL: wrong staging DB')
          iid=int(open(os.environ['RUNNER_TEMP']+'/staging-synthetic-iid.txt').read())
          checks=[
            ('inquiry',f"SELECT COUNT(*) AS n FROM beta_inquiries WHERE id={iid} AND kontakt='qa-inquiry-20261110@example.invalid'"),
            ('created audit',f"SELECT COUNT(*) AS n FROM beta_inquiry_events WHERE inquiry_id={iid} AND event_type='created'"),
            ('no auto offers',f"SELECT COUNT(*) AS n FROM ops_manual_offers WHERE inquiry_id={iid}"),
            ('no auto orders',f"SELECT COUNT(*) AS n FROM ops_manual_orders WHERE inquiry_id={iid}")
          ]
          outcomes={}
          for label,sql in checks:
            result=api('/query',{'sql':sql})
            arr=result if isinstance(result,list) else [result]
            vals=[r['n'] for p in arr if isinstance(p,dict) for r in p.get('results',[]) if 'n' in r]
            if len(vals)!=1: raise SystemExit('FAIL: unexpected D1 query')
            outcomes[label]=vals[0]
          expected={'inquiry':1,'created audit':1,'no auto offers':0,'no auto orders':0}
          if outcomes!=expected:raise SystemExit(f'FAIL: unexpected synthetic D1 verification counts: {outcomes}')
          print('PASS: synthetic inquiry in EU D1, one created audit event')
          print('PASS: no automatic offers or orders created')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('PASS: D1 contains exactly one matching inquiry and created-event; 0 automatic offers/orders.'+chr(10))
          PY
