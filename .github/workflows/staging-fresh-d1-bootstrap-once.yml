name: FinnBilGlass - one-time fresh EU staging schema bootstrap

# One-time, exact-sha-locked empty-staging D1 schema bootstrap.
# Runs no deploy, no customer import, no email, no payments.
# DELETE this workflow after success; do not retain a privileged fallback.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-fresh-d1-bootstrap-once.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fbg-one-time-eu-staging-schema
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Pin exact already-reviewed candidate and reject forks
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: "1f97c0202e0316ddfe77d62cbf19d6ce3b40fc84"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tajlive/finnbilglass'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'tajlive'
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/57")
          test "$(echo "$PR" | jq -r .state)" = open
          test "$(echo "$PR" | jq -r .draft)" = true
          test "$(echo "$PR" | jq -r .base.ref)" = main
          test "$(echo "$PR" | jq -r .head.ref)" = staging/first-sale-20261110
          test "$(echo "$PR" | jq -r .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          test "$(echo "$PR" | jq -r .head.sha)" = "$PINNED"
          echo "sha=$PINNED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and verify pinned candidate without Cloudflare credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          npm ci
          npm run qa
          python3 scripts/maintenance/staging-migration-rehearsal.py
          npx wrangler deploy --config wrangler.staging.toml --dry-run --outdir /tmp/fbg-one-time-bootstrap-bundle

  bootstrap-empty-eu-d1:
    needs: verify
    if: github.repository == 'tajlive/finnbilglass' && github.ref == 'refs/heads/main' && github.actor == 'tajlive'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout TRUSTED main, never checkout candidate with Cloudflare token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trusted pinned dependencies
        run: npm ci
      - name: Acquire exact pinned migration SQL as DATA, no execution
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          sha = os.environ['PINNED_SHA']
          assert sha == '1f97c0202e0316ddfe77d62cbf19d6ce3b40fc84'
          repo = os.environ['GITHUB_REPOSITORY']
          def read(path):
              req = subprocess.run(['gh','api',
                  f'repos/{repo}/contents/{path}?ref={sha}'],
                  text=True,capture_output=True,check=True)
              item = json.loads(req.stdout)
              if item.get('encoding') != 'base64':
                  raise ValueError('Unexpected GitHub content encoding')
              return base64.b64decode(item['content'])
          manifest_data = read('scripts/maintenance/staging-fresh-db-manifest.json')
          manifest = json.loads(manifest_data)
          assert manifest['account_id'] == '80d5b1d56a3e907150ba7348b6182894'
          assert manifest['database_name'] == 'finnbilglass-db-staging'
          assert manifest['database_id'] == '78842e17-ab0b-47c1-acde-244044073466'
          assert manifest['jurisdiction'] == 'eu'
          files = manifest['base'] + manifest['ops']
          assert len(manifest['base']) == 22 and len(manifest['ops']) == 5
          assert len(files) == len(set(files)) == 27
          assert files[-1] == 'migrations/proposed/0044_ops_offer_outbox.sql.proposed'
          assert files[0] == 'migrations/0001_resolver_tables.sql'
          for name in files:
              assert re.fullmatch(r'migrations/[a-zA-Z0-9_./-]+',name)
              assert '..' not in name
              assert name.endswith('.sql') or name.endswith('.sql.proposed')
              if name.startswith('migrations/proposed/'):
                  assert name in manifest['ops']
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'fbg-eu-schema'
          root.mkdir(parents=True,exist_ok=True)
          for idx,name in enumerate(files):
              (root / f'{idx:02d}.sql').write_bytes(read(name))
          (root/'manifest.json').write_text(json.dumps(manifest))
          (root/'files.json').write_text(json.dumps(files))
          print(f'Pinned {len(files)} staged-only SQL files from {sha}; no SQL executed')
          PY
          cat > "$RUNNER_TEMP/fbg-staging-d1-bootstrap.toml" <<'TOML'
          name = "fbg-eu-d1-schema-bootstrap"
          account_id = "80d5b1d56a3e907150ba7348b6182894"
          [[d1_databases]]
          binding = "FINNBILGLASS_DB"
          database_name = "finnbilglass-db-staging"
          database_id = "78842e17-ab0b-47c1-acde-244044073466"
          TOML
      - name: Verify isolated empty EU D1, record bookmark, apply reviewed schema, verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "80d5b1d56a3e907150ba7348b6182894"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          CFG="$RUNNER_TEMP/fbg-staging-d1-bootstrap.toml"
          DB="finnbilglass-db-staging"
          # Authoritative read-only DB identity+EU check before first SQL write.
          python3 - <<'PY'
          import json, os, urllib.request
          aid = '80d5b1d56a3e907150ba7348b6182894'
          uid = '78842e17-ab0b-47c1-acde-244044073466'
          uri = f'https://api.cloudflare.com/client/v4/accounts/{aid}/d1/database/{uid}'
          req=urllib.request.Request(uri,headers={
              'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],
              'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.loads(response.read(16384))
          db=data.get('result') or {}
          if (not data.get('success') or db.get('uuid')!=uid or
              db.get('name')!='finnbilglass-db-staging' or
              db.get('jurisdiction')!='eu'):
              raise SystemExit('STOP: expected isolated EU staging D1 identity not verified')
          print('PASS: exact EU staging account, name, and UUID')
          PY
          # Fail CLOSED if this DB is not empty. Never apply to production or old staging.
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > "$RUNNER_TEMP/fbg-tables-before.json"
          python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-tables-before.json'))
          records = data if isinstance(data,list) else [data]
          names=[r.get('name') for item in records for r in item.get('results',[])]
          user=[n for n in names if n and not n.startswith(('sqlite_','_cf_'))]
          if user:
              raise SystemExit(f'STOP: staging DB not empty; found {len(user)} existing user tables')
          print('PASS: fresh EU staging D1 is empty; no existing customer schema')
          PY
          # Capture Time Travel evidence before the first write; NEVER auto-restore.
          npx wrangler d1 time-travel info "$DB" --config "$CFG" --json > "$RUNNER_TEMP/fbg-before-bookmark.json"
          python3 - <<'PY'
          import json,os,re
          data=json.load(open(os.environ['RUNNER_TEMP']+'/fbg-before-bookmark.json'))
          text=json.dumps(data)
          match=re.search(r'[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}',text,re.I)
          if not match:
              raise SystemExit('STOP: cannot establish D1 Time Travel bookmark')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as o:
              o.write('### Pre-migration EU staging D1 bookmark\\n'+match.group(0)+'\\n')
          print('Verified pre-write D1 Time Travel bookmark (saved to release summary)')
          PY
          # Controlled schema-only migration. No user rows, catalog import or emails.
          for n in $(seq -w 0 26); do
            echo "Applying allowlisted EU staging schema fragment $n/26"
            npx wrangler d1 execute "$DB" --config "$CFG" --remote --yes \
              --file "$RUNNER_TEMP/fbg-eu-schema/$n.sql" >/dev/null
          done
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > "$RUNNER_TEMP/fbg-tables-after.json"
          npx wrangler d1 execute "$DB" --config "$CFG" --remote --json --command \
            "SELECT COUNT(*) AS n FROM beta_inquiries" > "$RUNNER_TEMP/fbg-inquiry-count.json"
          python3 - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP']
          manifest=json.load(open(root+'/fbg-eu-schema/manifest.json'))
          data=json.load(open(root+'/fbg-tables-after.json'))
          rows = data if isinstance(data,list) else [data]
          actual={r.get('name') for item in rows for r in item.get('results',[])}
          required=set(manifest['required_tables'])
          if not required<=actual:
              raise SystemExit(f'STOP: missing required staging OPS tables: {required-actual}')
          data=json.load(open(root+'/fbg-inquiry-count.json'))
          rows = data if isinstance(data,list) else [data]
          n=[r.get('n') for item in rows for r in item.get('results',[])]
          if n != [0]:
              raise SystemExit('STOP: unexpected customer inquiries in fresh staging')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\\n### EU staging D1 schema bootstrap COMPLETE\\n'
                        'DB: finnbilglass-db-staging / 78842e17-ab0b-47c1-acde-244044073466\\n'
                        'Historical schema fragments: 22; OPS: 5\\n'
                        f'Required tables: {len(required)} verified\\n'
                        'Customer inquiries: 0; no production data copied\\n'
                        'No Worker deployed, emails sent, or payments created\\n')
          print('PASS: fresh EU staging schema and OPS tables, zero customer inquiries')
          PY
