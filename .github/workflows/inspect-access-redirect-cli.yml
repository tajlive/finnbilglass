name: FinnBilGlass - inspect existing Cloudflare Access redirects

# Public, read-only CLI probe. No secrets, auth cookies, deploy, or D1 queries.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-access-redirect-cli.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-login:
    if: github.repository == 'tajlive/finnbilglass'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Locate Access issuer and application audience from public redirects
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.error, urllib.parse, os
          hosts = (
              'https://ops-staging.finnbilglass.no/',
              'https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev/health',
              'https://ops-staging.finnbilglass.no/cdn-cgi/access/login',
          )
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          output=['### Read-only Cloudflare staging Access discovery',
                  'No credentials, cookies, data writes, or Worker deployment used.']
          for origin in hosts:
              current=origin
              output.append('**Target:** `'+urllib.parse.urlsplit(origin).hostname+'`')
              for attempt in range(4):
                  req=urllib.request.Request(current,method='GET',
                      headers={'Accept':'text/html','User-Agent':'FinnBilGlass-Access-ReadOnly-Diagnostic/1'})
                  try:
                      with opener.open(req,timeout=12) as res:
                          code=res.status
                          location=res.headers.get('Location','')
                  except urllib.error.HTTPError as err:
                      code=err.code
                      location=err.headers.get('Location','')
                  except Exception as exc:
                      output.append('Network check failed: '+type(exc).__name__)
                      break
                  print(f'{urllib.parse.urlsplit(current).hostname}: HTTP {code}')
                  output.append('HTTP '+str(code))
                  if not (300<=code<400 and location):
                      break
                  nexturl=urllib.parse.urljoin(current,location)
                  p=urllib.parse.urlsplit(nexturl)
                  if p.scheme!='https' or not p.hostname:
                      output.append('Stopped at unsupported redirect')
                      break
                  if p.hostname.endswith('.cloudflareaccess.com'):
                      output.append('Cloudflare Access issuer: `'+p.hostname+'`')
                      print('Cloudflare Access issuer host: '+p.hostname)
                      print('Access redirect path: '+p.path[:220])
                      print('Access redirect query keys: '+','.join(sorted(urllib.parse.parse_qs(p.query))))
                      params=urllib.parse.parse_qs(p.query)
                      for qname in ('aud','audience','app_aud','application_aud'):
                          for val in params.get(qname,[]):
                              if re.fullmatch(r'[a-zA-Z0-9_-]{16,100}',val):
                                  print('Public Access audience param ('+qname+'): '+val)
                                  output.append('Public Access AUD parameter: `'+val+'`')
                  match=re.search(r'/cdn-cgi/access/login/([0-9a-zA-Z_-]{16,100})',p.path)
                  if match:
                      output.append('Access login route ID (verify vs AUD): `'+match.group(1)+'`')
                      print('Access public login route ID: '+match.group(1))
                  if p.hostname not in {
                      'ops-staging.finnbilglass.no',
                      'finnbilglass-frontrute-staging.tomarnejensen.workers.dev'
                  } and not p.hostname.endswith('.cloudflareaccess.com'):
                      output.append('Stopped before external identity-provider redirect')
                      break
                  current=nexturl
              output.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as file:
              file.write(chr(10).join(output))
          PY
