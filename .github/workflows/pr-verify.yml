# PR-verifisering — kjører på alle pull requests, også draft.
#
# Hensikt: feature-brancher skal aldri være uverifisert. Denne workflowen gjør
# nøyaktig det samme som test-gaten i deploy.yml, men deployer aldri og har ingen
# tilgang til produksjonssecrets.
#
# Bevisst uten `environment:` og uten `secrets` — en PR fra en branch skal ikke
# kunne nå Cloudflare.
name: PR Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testsuite
        run: npm test

      - name: Installer Chromium for skrivebeskyttet smoke (PR #40)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 40
        run: npx playwright install --with-deps chromium

      - name: Produksjons-smoke uten innsending (PR #40)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 40
        env:
          FBG_BASE: https://finnbilglass.no
          FBG_SEND_INQUIRY: '0'
        run: node scripts/betatest-e2e.mjs

      - name: Secret scan (blocking Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Sjekk hele gjeldende filtré (også Kustom public key)
        run: /tmp/gitleaks-8.30.1/gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 2

      - name: Ingen hemmelighetsfiler i git
        run: |
          LEAKS=$(git ls-files | grep -E '(^|/)(\.env(\.local)?|\.dev\.vars|wrangler\..*\.jsonc)$' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Hemmelighetsfil committet:"; echo "$LEAKS"; exit 1
          fi
          echo "OK — ingen hemmelighetsfiler i git"
