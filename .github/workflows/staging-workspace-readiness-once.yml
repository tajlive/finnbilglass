name: FinnBilGlass - staging readiness (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-workspace-readiness-once.yml]
  workflow_dispatch: {}

permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'tajlive/finnbilglass' && github.actor == 'tajlive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Inspect only secret binding NAMES for isolated staging Worker
        env:
          CF_EXISTING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CF_EXISTING_TOKEN','')
          if not token:raise SystemExit('STOP: Cloudflare diagnostic access missing')
          root='https://api.cloudflare.com/client/v4/accounts/80d5b1d56a3e907150ba7348b6182894'
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def read(path):
              req=urllib.request.Request(root+path,method='GET',headers=headers)
              with urllib.request.urlopen(req,timeout=18) as res: data=json.loads(res.read(100000))
              if not data.get('success'): raise SystemExit('STOP: Cloudflare response invalid')
              return data.get('result')
          db=read('/d1/database/78842e17-ab0b-47c1-acde-244044073466') or {}
          if db.get('name')!='finnbilglass-db-staging' or db.get('uuid')!='78842e17-ab0b-47c1-acde-244044073466' or db.get('jurisdiction')!='eu':
              raise SystemExit('STOP: EU staging D1 identity mismatch')
          entries=read('/workers/scripts/finnbilglass-frontrute-staging/secrets')
          if not isinstance(entries,list):raise SystemExit('STOP: no staging Worker secret list')
          names={i.get('name') for i in entries if isinstance(i,dict)}
          monitored=('RESEND_API_KEY','OPS_ACCESS_AUD','OPS_ACCESS_TEAM_DOMAIN',
                     'OPS_INBOUND_ADDRESS','SUPPORT_FROM_EMAIL',
                     'GMAIL_REFRESH_TOKEN','GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET',
                     'GMAIL_PUBSUB_TOPIC','RESEND_WEBHOOK_SECRET')
          notes=['### Gmail / Resend staging Worker configuration inventory',
                 'Read-only, secret names only. Neither tokens nor secret values queried or logged.',
                 'Worker: finnbilglass-frontrute-staging, D1: verified EU staging.']
          for key in monitored:
              present=key in names
              msg=f'{key}: '+('PRESENT (value not inspected)' if present else 'NOT PRESENT as Worker secret')
              print(msg)
              notes.append('- '+msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(chr(10).join(notes)+chr(10))
          PY

      - name: Inspect actual staging reply schema (read-only; no customer data)
        env:
          STAGING_READ_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ.get('STAGING_READ_TOKEN','')
          if not token: raise SystemExit('NO_GO: staging read token not configured')
          root='https://api.cloudflare.com/client/v4/accounts/80d5b1d56a3e907150ba7348b6182894'
          db_id='78842e17-ab0b-47c1-acde-244044073466'
          def api(path, method='GET', body=None):
              payload=json.dumps(body).encode('utf-8') if body is not None else None
              req=urllib.request.Request(root+path, data=payload, method=method, headers={
                  'Authorization':'Bearer '+token, 'Content-Type':'application/json', 'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=18) as rsp:
                      data=json.loads(rsp.read(65536))
              except urllib.error.HTTPError as err:
                  raise SystemExit('NO_GO: staging D1 metadata API HTTP-'+str(err.code))
              except Exception:
                  raise SystemExit('NO_GO: staging D1 metadata API unavailable')
              if data.get('success') is not True: raise SystemExit('NO_GO: Cloudflare API returned failure')
              return data.get('result')
          meta=api('/d1/database/'+db_id) or {}
          if meta.get('uuid')!=db_id or meta.get('name')!='finnbilglass-db-staging' or meta.get('jurisdiction')!='eu':
              raise SystemExit('NO_GO: staging database UUID/name/EU jurisdiction mismatch')
          sql=("SELECT type,name FROM sqlite_master WHERE "
               "(type='table' AND name IN ('beta_inquiries','ops_reply_outbox','ops_reply_attempts','ops_manual_offers','ops_manual_orders')) OR "
               "(type='index' AND name='idx_ops_reply_attempts_review') OR "
               "(type='trigger' AND name IN ('ops_reply_attempts_no_payload_rewrite','ops_reply_attempts_no_delete','ops_reply_attempts_no_status_regression')) "
               "ORDER BY type,name")
          result=api('/d1/database/'+db_id+'/query', 'POST', {'sql':sql})
          checks=result if isinstance(result,list) else [result]
          if not checks or any(not isinstance(x,dict) or x.get('success') is False for x in checks):
              raise SystemExit('NO_GO: staging schema query not verified')
          names={str(row.get('name','')) for x in checks for row in x.get('results',[]) if isinstance(row,dict)}
          required={'beta_inquiries','ops_reply_outbox','ops_manual_offers','ops_manual_orders'}
          missing=sorted(required-names)
          reply_ready='ops_reply_attempts' in names
          expected_objects={'idx_ops_reply_attempts_review','ops_reply_attempts_no_payload_rewrite','ops_reply_attempts_no_delete','ops_reply_attempts_no_status_regression'}
          missing_objects=sorted(expected_objects-names)
          # Only hard-coded SQL table names (never records or secret values).
          print('STAGING_BASE_TABLES_MISSING: '+(','.join(missing) if missing else 'NONE'))
          print('STAGING_REPLY_0046: '+('PRESENT' if reply_ready else 'MISSING'))
          print('STAGING_0046_OBJECTS_MISSING: '+(','.join(missing_objects) if missing_objects else 'NONE'))
          outcome='PASS' if not missing and reply_ready and not missing_objects else 'NO_GO'
          notes=['### Staging OPS reply schema (read-only)',
                 '- Correct EU D1 identity: PASS',
                 '- Base OPS tables: '+('PASS' if not missing else 'NO_GO, missing '+', '.join(missing)),
                 '- Additive 0046 ops_reply_attempts: '+('PRESENT' if reply_ready else 'MISSING'),
                 '- Additive 0046 index and 3 immutable guards: '+('PASS' if not missing_objects else 'NO_GO, missing '+', '.join(missing_objects)),
                 '- No database writes, customer queries, secret values, email, or deploy']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as out:
              out.write(chr(10).join(notes)+chr(10))
          print('Staging OPS schema readiness: '+outcome)
          if outcome!='PASS': raise SystemExit('NO_GO: complete reviewed staging schema gate before deployment')
          PY

      - name: Inventory exact staging Worker deployment versions (read-only)
        env:
          CF_WORKER_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          token=os.environ.get('CF_WORKER_READ_TOKEN','')
          if not token: raise SystemExit('NO_GO: existing read token unavailable')
          account='80d5b1d56a3e907150ba7348b6182894'
          script='finnbilglass-frontrute-staging'
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+script
          def read(path):
              request=urllib.request.Request(base+path,method='GET',headers={
                  'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=18) as response:
                      payload=json.loads(response.read(65536))
              except urllib.error.HTTPError as error:
                  raise SystemExit('NO_GO: worker deployments read HTTP-'+str(error.code))
              except Exception:
                  raise SystemExit('NO_GO: worker deployments metadata unavailable')
              if payload.get('success') is not True:
                  raise SystemExit('NO_GO: Cloudflare Worker API error')
              return payload.get('result') or {}
          result=read('/deployments?per_page=2')
          deployments=result.get('deployments',[]) if isinstance(result,dict) else []
          if not isinstance(deployments,list) or not deployments:
              raise SystemExit('NO_GO: active staging Worker deployment not found')
          active=deployments[0]
          versions=active.get('versions') or []
          if len(versions)!=1 or float(versions[0].get('percentage',0))!=100:
              raise SystemExit('NO_GO: unexpected traffic split; review before deploy')
          active_version=str(versions[0].get('version_id',''))
          if not re.fullmatch(r'[a-f0-9-]{36}',active_version,re.IGNORECASE):
              raise SystemExit('NO_GO: invalid active Worker version identifier')
          details=read('/versions/'+active_version)
          if details.get('id')!=active_version:
              raise SystemExit('NO_GO: active Worker version metadata mismatch')
          etag=((details.get('resources') or {}).get('script') or {}).get('etag')
          creation=(details.get('metadata') or {}).get('created_on') or 'unknown'
          source=(details.get('metadata') or {}).get('source') or 'unknown'
          print('STAGING_WORKER_ACTIVE_VERSION: '+active_version)
          print('STAGING_WORKER_ACTIVE_CREATED: '+str(creation))
          print('STAGING_WORKER_ACTIVE_SOURCE: '+str(source))
          print('STAGING_WORKER_SCRIPT_CONTENT_ETAG_PRESENT: '+str(bool(etag)))
          # A Cloudflare Worker version ID and content ETag are NOT a Git commit SHA.
          rollback='UNAVAILABLE'
          if len(deployments)>1:
              historical=deployments[1].get('versions') or []
              if len(historical)==1 and float(historical[0].get('percentage',0))==100:
                  candidate=str(historical[0].get('version_id',''))
                  if re.fullmatch(r'[a-f0-9-]{36}',candidate,re.IGNORECASE):
                      rollback=candidate
          print('STAGING_WORKER_ROLLBACK_VERSION: '+rollback)
          notes=['### Live staging Worker inventory (read-only)',
                 '- Worker: '+script,
                 '- Active Cloudflare version: '+active_version,
                 '- Active version created: '+str(creation),
                 '- Previous single-version deployment: '+rollback,
                 '- A version ID does not prove it contains PR #57 SHA.',
                 '- No production Worker or D1 data queried; no deploy.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as out:
              out.write(chr(10).join(notes)+chr(10))
          PY
