name: FinnBilGlass - staging readiness (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-workspace-readiness-once.yml]

permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'tajlive/finnbilglass' && github.actor == 'tajlive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Inspect only secret binding NAMES for isolated staging Worker
        env:
          CF_EXISTING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CF_EXISTING_TOKEN','')
          if not token:raise SystemExit('STOP: Cloudflare diagnostic access missing')
          root='https://api.cloudflare.com/client/v4/accounts/80d5b1d56a3e907150ba7348b6182894'
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def read(path):
              req=urllib.request.Request(root+path,method='GET',headers=headers)
              with urllib.request.urlopen(req,timeout=18) as res: data=json.loads(res.read(100000))
              if not data.get('success'): raise SystemExit('STOP: Cloudflare response invalid')
              return data.get('result')
          db=read('/d1/database/78842e17-ab0b-47c1-acde-244044073466') or {}
          if db.get('name')!='finnbilglass-db-staging' or db.get('uuid')!='78842e17-ab0b-47c1-acde-244044073466' or db.get('jurisdiction')!='eu':
              raise SystemExit('STOP: EU staging D1 identity mismatch')
          entries=read('/workers/scripts/finnbilglass-frontrute-staging/secrets')
          if not isinstance(entries,list):raise SystemExit('STOP: no staging Worker secret list')
          names={i.get('name') for i in entries if isinstance(i,dict)}
          monitored=('RESEND_API_KEY','OPS_ACCESS_AUD','OPS_ACCESS_TEAM_DOMAIN',
                     'OPS_INBOUND_ADDRESS','SUPPORT_FROM_EMAIL',
                     'GMAIL_REFRESH_TOKEN','GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET',
                     'GMAIL_PUBSUB_TOPIC','RESEND_WEBHOOK_SECRET')
          notes=['### Gmail / Resend staging Worker configuration inventory',
                 'Read-only, secret names only. Neither tokens nor secret values queried or logged.',
                 'Worker: finnbilglass-frontrute-staging, D1: verified EU staging.']
          for key in monitored:
              present=key in names
              msg=f'{key}: '+('PRESENT (value not inspected)' if present else 'NOT PRESENT as Worker secret')
              print(msg)
              notes.append('- '+msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(chr(10).join(notes)+chr(10))
          PY

      - name: Inspect actual staging reply schema (read-only; no customer data)
        env:
          STAGING_READ_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ.get('STAGING_READ_TOKEN','')
          if not token: raise SystemExit('NO_GO: staging read token not configured')
          root='https://api.cloudflare.com/client/v4/accounts/80d5b1d56a3e907150ba7348b6182894'
          db_id='78842e17-ab0b-47c1-acde-244044073466'
          def api(path, method='GET', body=None):
              payload=json.dumps(body).encode('utf-8') if body is not None else None
              req=urllib.request.Request(root+path, data=payload, method=method, headers={
                  'Authorization':'Bearer '+token, 'Content-Type':'application/json', 'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=18) as rsp:
                      data=json.loads(rsp.read(65536))
              except urllib.error.HTTPError as err:
                  raise SystemExit('NO_GO: staging D1 metadata API HTTP-'+str(err.code))
              except Exception:
                  raise SystemExit('NO_GO: staging D1 metadata API unavailable')
              if data.get('success') is not True: raise SystemExit('NO_GO: Cloudflare API returned failure')
              return data.get('result')
          meta=api('/d1/database/'+db_id) or {}
          if meta.get('uuid')!=db_id or meta.get('name')!='finnbilglass-db-staging' or meta.get('jurisdiction')!='eu':
              raise SystemExit('NO_GO: staging database UUID/name/EU jurisdiction mismatch')
          sql="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('beta_inquiries','ops_reply_outbox','ops_reply_attempts','ops_manual_offers','ops_manual_orders') ORDER BY name"
          result=api('/d1/database/'+db_id+'/query', 'POST', {'sql':sql})
          checks=result if isinstance(result,list) else [result]
          if not checks or any(not isinstance(x,dict) or x.get('success') is False for x in checks):
              raise SystemExit('NO_GO: staging schema query not verified')
          names={str(row.get('name','')) for x in checks for row in x.get('results',[]) if isinstance(row,dict)}
          required={'beta_inquiries','ops_reply_outbox','ops_manual_offers','ops_manual_orders'}
          missing=sorted(required-names)
          reply_ready='ops_reply_attempts' in names
          outcome='PASS' if not missing and reply_ready else 'NO_GO'
          notes=['### Staging OPS reply schema (read-only)',
                 '- Correct EU D1 identity: PASS',
                 '- Base OPS tables: '+('PASS' if not missing else 'NO_GO, missing '+', '.join(missing)),
                 '- Additive 0046 ops_reply_attempts: '+('PRESENT' if reply_ready else 'MISSING'),
                 '- No database writes, customer queries, secret values, email, or deploy']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as out:
              out.write(chr(10).join(notes)+chr(10))
          print('Staging OPS schema readiness: '+outcome)
          if outcome!='PASS': raise SystemExit('NO_GO: complete reviewed staging schema gate before deployment')
          PY
