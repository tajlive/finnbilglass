name: FinnBilGlass - Workspace staging readiness (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/staging-workspace-readiness-once.yml]

permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'tajlive/finnbilglass' && github.actor == 'tajlive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Inspect only secret binding NAMES for isolated staging Worker
        env:
          CF_EXISTING_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CF_EXISTING_TOKEN','')
          if not token:raise SystemExit('STOP: Cloudflare diagnostic access missing')
          root='https://api.cloudflare.com/client/v4/accounts/80d5b1d56a3e907150ba7348b6182894'
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def read(path):
              req=urllib.request.Request(root+path,method='GET',headers=headers)
              with urllib.request.urlopen(req,timeout=18) as res: data=json.loads(res.read(100000))
              if not data.get('success'): raise SystemExit('STOP: Cloudflare response invalid')
              return data.get('result')
          db=read('/d1/database/78842e17-ab0b-47c1-acde-244044073466') or {}
          if db.get('name')!='finnbilglass-db-staging' or db.get('uuid')!='78842e17-ab0b-47c1-acde-244044073466' or db.get('jurisdiction')!='eu':
              raise SystemExit('STOP: EU staging D1 identity mismatch')
          entries=read('/workers/scripts/finnbilglass-frontrute-staging/secrets')
          if not isinstance(entries,list):raise SystemExit('STOP: no staging Worker secret list')
          names={i.get('name') for i in entries if isinstance(i,dict)}
          monitored=('RESEND_API_KEY','OPS_ACCESS_AUD','OPS_ACCESS_TEAM_DOMAIN',
                     'OPS_INBOUND_ADDRESS','SUPPORT_FROM_EMAIL',
                     'GMAIL_REFRESH_TOKEN','GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET',
                     'GMAIL_PUBSUB_TOPIC','RESEND_WEBHOOK_SECRET')
          notes=['### Gmail / Resend staging Worker configuration inventory',
                 'Read-only, secret names only. Neither tokens nor secret values queried or logged.',
                 'Worker: finnbilglass-frontrute-staging, D1: verified EU staging.']
          for key in monitored:
              present=key in names
              msg=f'{key}: '+('PRESENT (value not inspected)' if present else 'NOT PRESENT as Worker secret')
              print(msg)
              notes.append('- '+msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(chr(10).join(notes)+chr(10))
          PY
