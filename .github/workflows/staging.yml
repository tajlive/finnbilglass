name: Staging verification and deployment
on:
  push:
    branches: ['feat/nordisk-klarhet-20261103']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: finnbilglass-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa
  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy staging Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Install Chromium for customer-flow verification
        run: npx playwright install --with-deps chromium
      - name: Verify staged customer flow
        env:
          FBG_BASE: https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev
          FBG_OUT: ${{ runner.temp }}/fbg-staging-e2e
        run: node scripts/e2e-release-chrome.mjs
