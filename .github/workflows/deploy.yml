# CI/CD — finnbilglass (produsert 2026-08-19, erstatter TODO-malen)
# Gates: test → (deploy ved [deploy]-markør / dispatch) → full betatest mot prod.
# Ingen prod-deploy uten grønne gates.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ingen hemmelighetsfiler i git
        run: |
          LEAKS=$(git ls-files | grep -E '(^|/)(\.env(\.local)?|\.dev\.vars|wrangler\..*\.jsonc)$' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Hemmelighetsfil committet:"; echo "$LEAKS"; exit 1
          fi
          echo "OK — ingen hemmelighetsfiler i git"
      # Hentet fra origin/main (gitleaks-allowlist). Ikke-blokkerende til
      # .gitleaks.toml er verifisert mot kjente falske treff (tabellnavn som
      # «evidence_cases» matcher generic-api-key).
      - name: Secret scan (allowlist via gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --config=.gitleaks.toml --verbose
        continue-on-error: true

  deploy:
    needs: [test-gate, security-check]
    # Auto-deploy ved [deploy]-markør i commit-melding eller manuell dispatch.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: SVV-nøkkel som Worker-secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SVV_API_KEY: ${{ secrets.SVV_API_KEY }}
        run: printf '%s' "$SVV_API_KEY" | npx wrangler secret put SVV_API_KEY --name finnbilglass-frontrute
      - name: Deploy Worker + assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Krev godkjent forside på apex og www (regresjonsvakt)
        run: |
          for i in 1 2 3 4 5; do
            if node scripts/forside-live-sjekk.mjs; then
              echo "OK — godkjent forside servert på begge domener"; exit 0
            fi
            echo "Forside ikke oppdatert ennå (forsøk $i) — venter på propagering"
            sleep 10
          done
          echo "::error::Forsiden på finnbilglass.no/www er ikke den godkjente kundeforsiden etter deploy"
          exit 1

  smoke-betatest:
    needs: [test-gate, security-check, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Full betatest mot prod
        run: node scripts/betatest-e2e.mjs
