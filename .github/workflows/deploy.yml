            process.exitCode=1;
          }
          const secrets = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/fbg-prod-secret-names.json','utf8'));
          if (!Array.isArray(secrets)) throw new Error('UNEXPECTED_WORKER_SECRET_LIST');
          const names = new Set(secrets.filter(s => s.type === 'secret_text').map(s => s.name));
          for (const key of ['SVV_API_KEY','RESEND_API_KEY','OPS_ACCESS_AUD']) {
