# CI/CD — finnbilglass (produsert 2026-08-19, erstatter TODO-malen)
# Gates: test → explicit manual PRODUCTION-GO + pinned SHA + environment approval → prod smoke.
# Ingen prod-deploy uten grønne gates.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      authorization:
        description: "Manual production release authorization (requires separate owner GO)"
        required: true
        type: choice
        options:
          - PRODUCTION-GO
      release_sha:
        description: "Exact 40-character approved main commit SHA"
        required: true
        type: string

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ingen hemmelighetsfiler i git
        run: |
          LEAKS=$(git ls-files | grep -E '(^|/)(\.env(\.local)?|\.dev\.vars|wrangler\..*\.jsonc)$' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Hemmelighetsfil committet:"; echo "$LEAKS"; exit 1
          fi
          echo "OK — ingen hemmelighetsfiler i git"
      # Blokker deploy hvis Gitleaks finner en reell hemmelighet.
      # public/index.html har kun én smal unntaksregel for Kustom Elements
      # sin dokumenterte, offentlige installasjonsnøkkel.
      - name: Secret scan (blocking Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Scan checked-out tree (blocking)
        run: /tmp/gitleaks-8.30.1/gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 2

  deploy:
    needs: [test-gate, security-check]
    # Never deploy on push. Manual dispatch AND separate environment approval required.
    if: github.event_name == 'workflow_dispatch' && inputs.authorization == 'PRODUCTION-GO'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless this is the exact approved main commit
        env:
          APPROVED_SHA: ${{ inputs.release_sha }}
          APPROVED_MODE: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          test "$APPROVED_MODE" = "PRODUCTION-GO"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release flags and existing Worker secrets (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "80d5b1d56a3e907150ba7348b6182894"
          # "wrangler secret put" would immediately deploy a Worker version!
          # Enumerate secret NAMES ONLY. Do not mutate bindings before the pinned deploy.
          npx wrangler secret list --name finnbilglass-frontrute --format json > "$RUNNER_TEMP/fbg-prod-secret-names.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('wrangler.toml','utf8');
          const scalar = key => {
            const m = new RegExp('^\\s*'+key+'\\s*=\\s*"([^"]+)"\\s*(?:#.*)?      - name: Deploy Worker + assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Krev godkjent forside på apex og www (regresjonsvakt)
        run: |
          for i in 1 2 3 4 5; do
            if node scripts/forside-live-sjekk.mjs; then
              echo "OK — godkjent forside servert på begge domener"; exit 0
            fi
            echo "Forside ikke oppdatert ennå (forsøk $i) — venter på propagering"
            sleep 10
          done
          echo "::error::Forsiden på finnbilglass.no/www er ikke den godkjente kundeforsiden etter deploy"
          exit 1

