          const expected = {
            name: 'finnbilglass-frontrute',
            account_id: '80d5b1d56a3e907150ba7348b6182894',
            database_id: 'ac35018c-0d43-4742-adf8-d881b7274684',
            ENVIRONMENT: 'production',
            OPS_STAFF_PORTAL_ENABLED: 'true',
            OPS_MANUAL_ORDERS_ENABLED: 'true',
            OPS_WORKBENCH_ENABLED: 'true',
            OPS_ACCESS_TEAM_DOMAIN: 'tomarnejensen.cloudflareaccess.com',
            GMAIL_SYNC_ENABLED: 'false',
            OPS_WORKSPACE_OAUTH_ENABLED: 'false'
          };
          for (const [key,value] of Object.entries(expected)) {
