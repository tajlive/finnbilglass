# CI/CD — finnbilglass (Klarpakke-standard: test → deploy → smoke → auto-rollback)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test-gate:
    name: Test Gate (tsc + lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (allowlist via gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --config=.gitleaks.toml --verbose
        continue-on-error: true

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test-gate, security-check]
    # Auto-deploy ved [deploy]-markør i commit-melding eller manuell dispatch.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SVV_API_KEY: ${{ secrets.SVV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set SVV_API_KEY secret (staging)
        run: |
          printf '%s' "$SVV_API_KEY" | npx wrangler secret put SVV_API_KEY --name finnbilglass-frontrute-staging --config wrangler.staging.toml
      - name: Set SVV_API_KEY secret (prod)
        run: |
          printf '%s' "$SVV_API_KEY" | npx wrangler secret put SVV_API_KEY --name finnbilglass-frontrute
      - name: Deploy Worker (staging)
        run: |
          npx wrangler deploy --config wrangler.staging.toml
          echo "STAGING_URL=https://finnbilglass-frontrute-staging.tomarnejensen.workers.dev" >> $GITHUB_ENV
      - name: Deploy Worker (prod)
        run: |
          npx wrangler deploy
          echo "PROD_URL=https://finnbilglass.no" >> $GITHUB_ENV

  smoke:
    name: Smoke Test (health + landing + i18n-keys)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to propagate
        run: sleep 15
      - name: Health check (staging)
        run: |
          curl -sf "$STAGING_URL/health" | jq -e '.ok == true'
      - name: Health check (prod)
        run: |
          curl -sf "$PROD_URL/health" | jq -e '.ok == true'
      - name: Landing page check (staging)
        run: |
          curl -sf "$STAGING_URL/" | grep -q "Finnbilglass"
      - name: Landing page check (prod)
        run: |
          curl -sf "$PROD_URL/" | grep -q "Finnbilglass"
      - name: i18n keys check
        run: |
          # Verifiser at alle t()-kall i kildekoden har nøkler i ALLE språkfiler
          node scripts/i18n-keys-audit.mjs

  auto-rollback:
    name: Auto Rollback on Smoke Failure
    needs: [deploy, smoke]
    if: failure()
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Rollback to previous version
        run: |
          npx wrangler rollback
      - name: Alert via Linear
        if: always()
        run: |
          echo "::notice ::Auto-rollback utført. Sjekk Linear for oppgave."
          # Eller bruk Linear API med fingerprint-dedup
