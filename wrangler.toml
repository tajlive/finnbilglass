name = "finnbilglass-frontrute"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Tvinger prod-konto (80d5b1d5) — hindrer at wrangler velger feil konto når
# OAuth-login (som ser flere kontoer) er aktivt uten CLOUDFLARE_ACCOUNT_ID.
account_id = "80d5b1d56a3e907150ba7348b6182894"

# ── Workers AI (bilde-avlesning: 43R/eurocode/OEM/features) ──
[ai]
binding = "AI"

# ── D1 (glass-katalog: 29 627 rader, glass_prisliste) ─────
[[d1_databases]]
binding = "FINNBILGLASS_DB"
database_name = "finnbilglass-db"
database_id = "ac35018c-0d43-4742-adf8-d881b7274684"

# ── R2 (opplæringsbilder: skilt-foto + 43R-foto, ALDRI slettet uten avtale) ──
[[r2_buckets]]
binding = "OPPLAERING_BUCKET"
bucket_name = "finnbilglass-opplaering"

# ── Secrets (IKKE i denne filen — bruk wrangler secret put): ──
#    wrangler secret put SVV_API_KEY   (kjennemerke → bil, kommende)
#    wrangler secret put IMAGE_RESOLVER_SECRET  (pilot-API for B2B/FinnBilGlass)
#    wrangler secret put CRON_SECRET

[vars]
ENVIRONMENT = "production"
# Evidence-flyt feature-flags — avgrenset release (Tom 2026-08-19): kun opplasting åpen.
EVIDENCE_UPLOAD_ENABLED = "true"
EVIDENCE_REVIEW_ENABLED = "false"
EVIDENCE_STATUS_CHANGE_ENABLED = "true"

# ── Observability (Tom 2026-08-19): Workers Logs-lagring AV (kostnad),
#    invocation_logs PÅ (wrangler tail / debugging) ──────────────────
[observability.logs]
enabled = false
invocation_logs = true

# ── Statisk frontend (prototype public/) ──────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/support/evidence", "/ops"]

# ── Custom domains (opprettes av wrangler ved deploy) ──────────
# apex + www serverer landingsside inntil Pages-frontenden tar over; api = matcher
[[routes]]
pattern = "finnbilglass.no"
custom_domain = true
zone_name = "finnbilglass.no"

[[routes]]
pattern = "www.finnbilglass.no"
custom_domain = true
zone_name = "finnbilglass.no"

[[routes]]
pattern = "api.finnbilglass.no"
custom_domain = true
zone_name = "finnbilglass.no"
