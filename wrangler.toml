name = "finnbilglass-frontrute"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Tvinger prod-konto (80d5b1d5) — hindrer at wrangler velger feil konto når
# OAuth-login (som ser flere kontoer) er aktivt uten CLOUDFLARE_ACCOUNT_ID.
account_id = "80d5b1d56a3e907150ba7348b6182894"

# ── Workers AI (bilde-avlesning: 43R/eurocode/OEM/features) ──
[ai]
binding = "AI"

# ── D1 (glass-katalog: 29 627 rader, glass_prisliste) ─────
[[d1_databases]]
binding = "FINNBILGLASS_DB"
database_name = "finnbilglass-db"
database_id = "ac35018c-0d43-4742-adf8-d881b7274684"

# Test-auth-DB-er (FINNBILGLASS_LOCAL_AUTH / FINNBILGLASS_STAGING_AUTH) er
# bevisst IKKE bundet her: toppnivå = produksjon. De finnes kun under
# [env.staging] og i lokal utvikling via egen dev-konfig.

# ── R2 (opplæringsbilder: skilt-foto + 43R-foto, ALDRI slettet uten avtale) ──
[[r2_buckets]]
binding = "OPPLAERING_BUCKET"
bucket_name = "finnbilglass-opplaering"

# ── Secrets (IKKE i denne filen — bruk wrangler secret put): ──
#    wrangler secret put SVV_API_KEY   (kjennemerke → bil, kommende)
#    wrangler secret put IMAGE_RESOLVER_SECRET  (pilot-API for B2B/FinnBilGlass)
#    wrangler secret put CRON_SECRET

[vars]
ENVIRONMENT = "production"
# Evidence-flyt feature-flags — avgrenset release (Tom 2026-08-19): kun opplasting åpen.
EVIDENCE_UPLOAD_ENABLED = "true"
EVIDENCE_REVIEW_ENABLED = "false"
EVIDENCE_STATUS_CHANGE_ENABLED = "true"

# ── Observability (Tom 2026-08-19): Workers Logs-lagring AV (kostnad),
#    invocation_logs PÅ (wrangler tail / debugging) ──────────────────
[observability.logs]
enabled = false
invocation_logs = true

# ── Staging-miljø ──
[env.staging]
# Staging beholder workers.dev-URL (prod har den av).
workers_dev = true
# Staging skal ALDRI eie produksjonsdomenene. Uten denne arver staging de
# globale [[routes]]-oppføringene, og hver staging-deploy flytter
# finnbilglass.no over til staging-konfigurasjonen (feil miljø, feil D1).
routes = []
[env.staging.vars]
ENVIRONMENT = "staging"
EVIDENCE_UPLOAD_ENABLED = "true"
EVIDENCE_REVIEW_ENABLED = "false"
EVIDENCE_STATUS_CHANGE_ENABLED = "true"
inquiries_enabled = "true"

[[env.staging.d1_databases]]
binding = "FINNBILGLASS_DB"
database_name = "finnbilglass-staging-catalog"
database_id = "79d63481-d54b-4522-9e74-80415e781b7a"

[[env.staging.d1_databases]]
binding = "FINNBILGLASS_STAGING_AUTH"
database_name = "finnbilglass-staging-auth"
database_id = "0b024ab6-4e9c-4fda-ab19-439e11e631fb"

# ── Statisk frontend (prototype public/) ──────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/support/evidence", "/ops", "/min-side", "/logg-inn", "/login"]

# ── Custom domains ────────────────────────────────────────────
# finnbilglass.no / www / api er knyttet til denne Workeren via Workers
# Domains-API-et (accounts/{acct}/workers/domains), IKKE via [[routes]].
# De er bevisst fjernet herfra: CI-tokenet har ikke workers/routes-skriving,
# og en [[routes]]-deklarasjon får wrangler til å forsøke å synkronisere
# domenene på hver deploy (feiler med «No access to the specified resource»).
# Domenene forblir tilknyttet Workeren uendret ved deploy.
