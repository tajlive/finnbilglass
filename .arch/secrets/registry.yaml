# Secret Registry (v2) — finnbilglass
# REFERANSER, ALDRI VERDIER. Verdier bor i BWS / wrangler / GitHub Actions / .env.local.
# Format per entry: uri, store, key_name, consumers, status.
entries:
  - uri: secret://github/finnbilglass/CLOUDFLARE_API_TOKEN
    store: github_actions
    key_name: CLOUDFLARE_API_TOKEN
    consumers: [deploy.yml]
    status: active
    note: "CF account-token (KLARPAKKE 80d5b1d5) — sat 2026-08-13"
  - uri: secret://github/finnbilglass/CLOUDFLARE_ACCOUNT_ID
    store: github_actions
    key_name: CLOUDFLARE_ACCOUNT_ID
    consumers: [deploy.yml]
    status: active
    note: "80d5b1d56a3e907150ba7348b6182894"
  - uri: secret://bws/klarpakke/DOMENESHOP_TOKEN
    store: bws
    key_name: DOMENESHOP_TOKEN
    consumers: [domeneshop-api]
    status: active
    note: "Domeneshop API token (ny, utløper 2027-08-13). Basic Auth token:secret mot api.domeneshop.no"
  - uri: secret://bws/klarpakke/DOMENESHOP_SECRET
    store: bws
    key_name: DOMENESHOP_SECRET
    consumers: [domeneshop-api]
    status: active
    note: "Par til DOMENESHOP_TOKEN"
