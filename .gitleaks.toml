# gitleaks config for FinnBilGlass
# Basert på Arch secret-audit.mjs pattern

[allowlist]
description = "FinnBilGlass allowlist - secrets som er OK i repoet"
# Tillater test/fixture data og eksempel-verdier
paths = [
  "(?i)test",
  "(?i)fixture",
  "(?i)example",
  "(?i)mock",
  "(?i)sample",
  "(?i)dummy",
  "scripts/out/",
  "data/fixtures/",
]

# Tillater spesifikke filer
files = [
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
  "*.md",
  "*.txt",
]

# Tillater commits
commits = [
  "initial",
  "init",
  "seed",
  "fixture",
]

# Tillater regex-mønstre i koden som ser ut som secrets men ikke er det
regexes = [
  "example",
  "placeholder",
  "your_.*_here",
  "xxx+",
  "test",
  "dummy",
  "fake",
  "mock",
  "sk_test_",
  "pk_test_",
]

# Tillater environment variable referanser
envVars = [
  "CLOUDFLARE_API_TOKEN",
  "CLOUDFLARE_ACCOUNT_ID",
  "SVV_API_KEY",
  "BREVO_API_KEY",
  "CRON_SECRET",
  "IMAGE_RESOLVER_SECRET",
  "SUPABASE_ACCESS_TOKEN",
  "TAVILY_API_KEY",
  "DEEPSEEK_API_KEY",
  "GEMINI_API_KEY",
  "NOUS_API_KEY",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "MCP_.*_API_KEY",
]

[extend]
# Use the default gitleaks rules as base
useDefault = true