<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 40px; background: #666; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .plate {
    width: 520px; height: 110px; background: #fff; border-radius: 8px;
    display: flex; align-items: center; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .eu {
    width: 92px; height: 100%; background: #003399; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; letter-spacing: 1px;
  }
  .eu .stars { font-size: 10px; line-height: 1.15; letter-spacing: 2px; margin-bottom: 4px; text-align: center; }
  .nr { font-size: 62px; font-weight: 800; letter-spacing: 10px; color: #000; margin-left: 26px; }
</style>
</head>
<body>
  <div class="plate">
    <div class="eu"><div class="stars">★ ★ ★ ★ ★ ★</div>N</div>
    <div class="nr">SU18018</div>
  </div>
</body>
</html>
